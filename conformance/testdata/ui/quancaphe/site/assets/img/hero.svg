    <path d="M668 50h44l-4 46h-36z"/><path d="M728 50h44l-4 46h-36z"/><path d="M788 50h44l-4 46h-36z"/>
    <path d="M868 140h44l-4 46h-36z"/><path d="M928 140h44l-4 46h-36z"/><path d="M988 140h44l-4 46h-36z"/>
  </g>
  <!-- đèn treo -->
  <path d="M260 0v70" stroke="#5b3a22" stroke-width="4"/>
  <path d="M220 70h80l-14 34h-52z" fill="#c8742c"/>
  <circle cx="260" cy="112" r="10" fill="#ffe2b0"/>
  <!-- máy pha -->
