<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Quầy pha chế của quán">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d8c4"/>
      <stop offset="1" stop-color="#d9bfa1"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".35" stop-color="#1f140d" stop-opacity="0"/>
      <stop offset="1" stop-color="#1f140d" stop-opacity=".78"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#wall)"/>
  <!-- kệ và ly trên tường -->
  <rect x="640" y="96" width="460" height="10" rx="5" fill="#a77b52"/>
  <rect x="640" y="186" width="460" height="10" rx="5" fill="#a77b52"/>
