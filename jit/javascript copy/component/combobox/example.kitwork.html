<!-- ============================================================================ -->
<!-- Kitwork Component Example: Headless Combobox (Draft 0.5 Compliant)         -->
<!-- Location: engine/jit/javascript/component/combobox/example.kitwork.html     -->
<!-- ============================================================================ -->

<div data-kit-component="combobox"
     data-kit-click:outside="$component.close()"
     class="relative w-72">
  
  <input data-kit-model="query"
         data-kit-keydown:escape="$component.close()"
         data-kit-bind="
             role: 'combobox';
             aria-expanded: open;
             placeholder: 'Tìm kiếm quốc gia...';
         "
         class="w-full px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm" />

  <ul role="listbox"
      data-kit-show="open"
      class="absolute left-0 right-0 mt-1 max-h-60 overflow-auto bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 py-1 z-50">
    <li role="option" data-kit-click="$component.select('Việt Nam')" class="px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 cursor-pointer">Việt Nam</li>
    <li role="option" data-kit-click="$component.select('Nhật Bản')" class="px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 cursor-pointer">Nhật Bản</li>
    <li role="option" data-kit-click="$component.select('Hàn Quốc')" class="px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 cursor-pointer">Hàn Quốc</li>
  </ul>
</div>
