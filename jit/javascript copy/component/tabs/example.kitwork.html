<!-- ============================================================================ -->
<!-- Kitwork Component Example: Headless Tabs (Draft 0.5 Compliant)              -->
<!-- Location: engine/jit/javascript/component/tabs/example.kitwork.html          -->
<!-- ============================================================================ -->

<div data-kit-component="tabs" class="w-full">
  <!-- Thanh Tab Headers -->
  <div role="tablist" class="flex border-b border-slate-200 dark:border-slate-700 gap-2">
    <button data-kit-click="$component.select('overview')"
            data-kit-bind="
                role: 'tab';
                'aria-selected': activeTab === 'overview';
            "
            data-kit-class="activeTab === 'overview' ? 'border-b-2 border-indigo-600 font-bold text-indigo-600' : 'text-slate-500'"
            class="px-4 py-2 text-sm transition">
      Tổng quan
    </button>

    <button data-kit-click="$component.select('settings')"
            data-kit-bind="
                role: 'tab';
                'aria-selected': activeTab === 'settings';
            "
            data-kit-class="activeTab === 'settings' ? 'border-b-2 border-indigo-600 font-bold text-indigo-600' : 'text-slate-500'"
            class="px-4 py-2 text-sm transition">
      Cài đặt
    </button>
  </div>

  <!-- Nội dung Tab Panels -->
  <div class="py-4">
    <div data-kit-show="activeTab === 'overview'" role="tabpanel" class="text-sm text-slate-700 dark:text-slate-300">
      Nội dung trang tổng quan dự án...
    </div>

    <div data-kit-show="activeTab === 'settings'" role="tabpanel" class="text-sm text-slate-700 dark:text-slate-300">
      Nội dung trang cấu hình cài đặt...
    </div>
  </div>
</div>
