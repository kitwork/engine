<!-- ============================================================================ -->
<!-- Kitwork Component Example: Theme Toggle                                    -->
<!-- Location: engine/jit/javascript/component/theme/example.kitwork.html      -->
<!-- ============================================================================ -->

<!-- 1. Nút chuyển đổi Theme nhanh (Toggle Light / Dark) -->
<div data-kit-component="theme" class="inline-block">
  <button data-kit-click="toggle()"
          class="flex items-center gap-2 px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-lg shadow-sm transition">
    <i data-kit-class="icon-sun: isLight; icon-moon: isDark;" class="w-5 h-5"></i>
    <span>Chế độ: <b data-kit-text="resolved"></b></span>
  </button>
</div>

<!-- 2. Bộ chọn 3 chế độ (Gán trực tiếp mode = 'light', mode = 'dark', mode = 'system') -->
<div data-kit-component="theme" class="flex gap-2 my-4">
  <button data-kit-click="mode = 'light'"
          data-kit-class="bg-indigo-600 text-white: mode === 'light'; bg-slate-100 text-slate-700: mode !== 'light';"
          class="px-3 py-1.5 rounded-md font-medium text-sm transition">
    Sáng (Light)
  </button>

  <button data-kit-click="mode = 'dark'"
          data-kit-class="bg-indigo-600 text-white: mode === 'dark'; bg-slate-100 text-slate-700: mode !== 'dark';"
          class="px-3 py-1.5 rounded-md font-medium text-sm transition">
    Tối (Dark)
  </button>

  <button data-kit-click="mode = 'system'"
          data-kit-class="bg-indigo-600 text-white: mode === 'system'; bg-slate-100 text-slate-700: mode !== 'system';"
          class="px-3 py-1.5 rounded-md font-medium text-sm transition">
    Theo Hệ điều hành (System)
  </button>
</div>
