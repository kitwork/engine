<!-- ============================================================================ -->
<!-- Kitwork Component Example: Drawer / Sidebar (Draft 0.5 Compliant)            -->
<!-- Location: engine/jit/javascript/component/drawer/example.kitwork.html       -->
<!-- ============================================================================ -->

<!-- 1. Drawer / Sidebar trượt từ bên trái màn hình (Sử dụng Direct Alias $sidebarDrawer) -->
<div data-kit-component="drawer"
     data-kit-as="$sidebarDrawer"
     data-kit-show="open"
     data-kit-keydown:escape:window="$component.close()"
     class="fixed inset-0 z-50 flex">
  
  <!-- Backdrop làm mờ phông nền (Click outside để đóng) -->
  <div data-kit-click="$component.close()"
       class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>

  <!-- Bảng điều hướng Sidebar trượt vào -->
  <div class="relative w-72 max-w-full bg-white dark:bg-slate-900 h-full p-6 shadow-2xl flex flex-col z-10 border-r border-slate-200 dark:border-slate-800">
    <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800">
      <h3 data-kit-text="title" class="font-bold text-lg text-slate-800 dark:text-slate-100"></h3>
      <button data-kit-click="$component.close()" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <nav class="flex-1 space-y-1">
      <a href="#" class="block px-3 py-2 text-sm font-medium bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 rounded-lg">Tổng quan bảng điều khiển</a>
      <a href="#" class="block px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg">Quản lý tài khoản</a>
      <a href="#" class="block px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg">Cấu hình bảo mật</a>
    </nav>
  </div>
</div>

<!-- 2. Nút bấm ở trang chính mở Sidebar thông qua $sidebarDrawer.show() -->
<div class="p-6">
  <button data-kit-click="$sidebarDrawer.show()"
          class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
    Mở Drawer Sidebar
  </button>
</div>
