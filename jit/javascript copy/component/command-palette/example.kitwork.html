<!-- Kitwork Component Example: Headless Command Palette (Draft 0.5 Compliant)   -->
<!-- Location: engine/jit/javascript/component/command-palette/example.kitwork.html-->
<!-- ============================================================================ -->

<!-- Modal Command Palette (Sử dụng Alias $cmdPalette) -->
<div data-kit-component="command-palette"
     data-kit-as="$cmdPalette"
     data-kit-show="open"
     data-kit-keydown:escape:window="$component.close()"
     class="fixed inset-0 z-50 flex items-start justify-center pt-20 px-4">
  
  <!-- Backdrop mờ -->
  <div data-kit-click="$component.close()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm"></div>

  <!-- Hộp tìm kiếm lệnh Command Palette -->
  <div class="relative w-full max-w-xl bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden z-10">
    <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center gap-3">
      <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input data-kit-model="query"
             data-kit-ref="cmdInput"
             placeholder="Gõ lệnh hoặc tìm kiếm..."
             class="w-full bg-transparent text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none text-sm font-medium" />
    </div>

    <ul class="p-2 max-h-80 overflow-auto divide-y divide-slate-100 dark:divide-slate-700/50 text-sm">
      <li class="p-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 rounded-xl cursor-pointer flex justify-between items-center text-slate-700 dark:text-slate-200">
        <span>Tạo bài viết mới</span>
        <span class="text-xs text-slate-400 bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded">⌘N</span>
      </li>
      <li class="p-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 rounded-xl cursor-pointer flex justify-between items-center text-slate-700 dark:text-slate-200">
        <span>Mở Cài đặt hệ thống</span>
        <span class="text-xs text-slate-400 bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded">⌘,</span>
      </li>
    </ul>
  </div>
</div>

<!-- Nút mở Command Palette trên trang -->
<div class="p-6">
  <button data-kit-click="$cmdPalette.show()" class="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-medium">
    Mở Command Palette (⌘K)
  </button>
</div>
