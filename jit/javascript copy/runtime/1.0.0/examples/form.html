<!doctype html>
<html lang="en" data-kit-app="main">
<head>
  <meta charset="utf-8">
  <title>Kitwork 1.0 — Form Matrix & Controls Example</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0c0a09; color: #f5f5f4; padding: 2rem; max-width: 600px; margin: 0 auto; }
    .card { background: #1c1917; border: 1px solid #292524; padding: 1.5rem; border-radius: 0.75rem; }
    .field { margin-bottom: 1.25rem; }
    .field label { display: block; font-size: 0.875rem; font-weight: 600; color: #a8a29e; margin-bottom: 0.35rem; }
    .input, select, textarea { width: 100%; box-sizing: border-box; background: #0c0a09; border: 1px solid #44403c; color: white; padding: 0.6rem; border-radius: 0.375rem; font-size: 0.95rem; }
    .row { display: flex; gap: 1rem; }
    .btn { background: #10b981; color: black; border: none; padding: 0.75rem 1.5rem; border-radius: 0.375rem; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; }
    .preview { background: #0c0a09; border: 1px dashed #78716c; padding: 1rem; border-radius: 0.5rem; margin-top: 1.5rem; font-family: monospace; font-size: 0.875rem; }
  </style>
</head>
<body>

  <h1>Kitwork 1.0 — Form Controls Matrix</h1>

  <div
    data-kit-component="user-profile-form"
    data-kit-scope="
      name: 'Nguyen Van A';
      age: 28;
      role: 'developer';
      newsletter: true;
      gender: 'male';
      bio: 'Building sovereign multi-tenant apps with Kitwork Go Engine & JS Runtime.';
      joinedDate: '2026-08-08';
      submitted: false;
    "
    class="card">

    <form data-kit-submit:prevent="$component.submit()">

      <div class="field">
        <label>Full Name</label>
        <input class="input" type="text" data-kit-model="name">
      </div>

      <div class="row">
        <div class="field" style="flex: 1;">
          <label>Age</label>
          <input class="input" type="number" data-kit-model="age">
        </div>

        <div class="field" style="flex: 1;">
          <label>Role</label>
          <select data-kit-model="role">
            <option value="developer">Developer</option>
            <option value="designer">Designer</option>
            <option value="manager">Product Manager</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Gender</label>
        <div style="display: flex; gap: 1.5rem; margin-top: 0.5rem;">
          <label style="font-weight: normal; color: white;">
            <input type="radio" name="gender" value="male" data-kit-model="gender"> Male
          </label>
          <label style="font-weight: normal; color: white;">
            <input type="radio" name="gender" value="female" data-kit-model="gender"> Female
          </label>
        </div>
      </div>

      <div class="field">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: white;">
          <input type="checkbox" data-kit-model="newsletter"> Subscribe to Kitwork release updates
        </label>
      </div>

      <div class="field">
        <label>Bio</label>
        <textarea rows="3" data-kit-model="bio"></textarea>
      </div>

      <div class="field">
        <label>Joined Date</label>
        <input class="input" type="date" data-kit-model="joinedDate">
      </div>

      <button
        type="submit"
        class="btn"
        data-kit-bind="
          disabled: !name || !age;
          data-state: submitted ? 'saved' : 'idle';
        ">
        Save Profile State
      </button>

    </form>

    <!-- Live JSON State Preview -->
    <div class="preview">
      <div style="color: #10b981; font-weight: bold; margin-bottom: 0.5rem;" data-kit-text="`User: ${name} (${role})`"></div>
      <div><strong>State JSON:</strong></div>
      <pre data-kit-text="`{\n  name: '${name}',\n  age: ${age},\n  role: '${role}',\n  gender: '${gender}',\n  newsletter: ${newsletter},\n  joinedDate: '${joinedDate}'\n}`"></pre>
    </div>

  </div>

  <script src="../dist/kitwork-runtime.js"></script>
  <script>
    kit.component("user-profile-form", {
      submit() {
        this.submitted = true;
        alert("Form submitted! Live state serialized for " + this.name);
      }
    });
    kit.start();
  </script>
</body>
</html>
