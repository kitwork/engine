<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Drive Page Two</title>
  <meta name="description" content="page two">
</head>
<body>
<main id="driveApp" data-kit-app="main" data-kit-drive data-kit-scope="page: 'two'; draft: 'server-two';">
  <h1 id="heading">Page Two</h1>
  <div id="counter" data-kit-component="drive-counter" data-kit-as="$driveCounter" data-kit-scope="count: 999;">
    <span id="counterValue" data-kit-text="count"></span>
    <button id="counterInc" data-kit-click="$component.increment()">+</button>
  </div>
  <div id="persist" data-kit-persist="global-widget">Server replacement</div>
  <input id="draft" name="draft" value="server-two" data-kit-model="draft">
  <span id="draftText" data-kit-text="draft"></span>
  <div id="newComponent" data-kit-component="new-box"><span id="newState" data-kit-text="status"></span></div>
  <a id="toPage3" href="/test/fixtures/drive-page3.html" data-kit-prefetch="hover">Page Three</a>
  <form id="postForm" method="post" action="/test/fixtures/drive-page3.html">
    <input name="message" value="hello">
    <button type="submit">Post</button>
  </form>
  <form id="searchForm" method="get" action="/test/fixtures/drive-page3.html">
    <input name="q" value="kitwork">
    <button type="submit">Search</button>
  </form>
  <script>window.__driveScriptRuns = (window.__driveScriptRuns || 0) + 1;</script>
</main>
</body>
</html>
