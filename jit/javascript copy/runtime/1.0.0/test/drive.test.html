    history.replaceState = function (state, title, url) { window.__historyCalls.push({ type: "replace", state, url: String(url) }); };
    window.fetch = function (input, options) {
      const url = new URL(String(input), document.baseURI);
      window.__fetchCalls.push(url.href);
      window.__fetchOptions.push(options || {});
      const body = window.__drivePages[url.pathname];
      if (body == null) return Promise.resolve(new Response("not found", { status: 404, headers: { "content-type": "text/plain" } }));

  <script src="../dist/kitwork-runtime.js"></script>
  <script>
    window.__driveStats = { counterMounts: 0, counterUnmounts: 0, removedUnmounts: 0, newMounts: 0, loads: 0 };
    kit.component("drive-counter", {
      count: 0,
      increment() { this.count = this.count + 1; },
      mount() { window.__driveStats.counterMounts++; },
      unmount() { window.__driveStats.counterUnmounts++; }
    });
    kit.component("removed-box", {
      mount() {},
      unmount() { window.__driveStats.removedUnmounts++; }
    });
    kit.component("new-box", {
      status: "new-mounted",
      mount() { window.__driveStats.newMounts++; }
    });
  </script>
</head>
<body>
<main id="driveApp" data-kit-app="main" data-kit-drive data-kit-scope="page: 'one'; draft: 'server-one';">
  <h1 id="heading">Page One</h1>
  <div id="counter" data-kit-component="drive-counter" data-kit-as="$driveCounter" data-kit-scope="count: 5;">
    <span id="counterValue" data-kit-text="count"></span>
    <button id="counterInc" data-kit-click="$component.increment()">+</button>
  </div>
  <div id="removed" data-kit-component="removed-box"></div>
  <div id="persist" data-kit-persist="global-widget">Initial persistent</div>
  <input id="draft" name="draft" value="server-one" data-kit-model="draft">
  <span id="draftText" data-kit-text="draft"></span>
</main>
<pre id="results">pending</pre>
<script>
(function () {
  const results = [];
  function assert(name, condition, details) {
    results.push({ name, passed: !!condition, details: details || "" });
    if (!condition) console.error("FAIL", name, details || "");
  }
  function tick(ms) { return new Promise(resolve => setTimeout(resolve, ms == null ? 0 : ms)); }
  function finish() {
    const passed = results.filter(item => item.passed).length;
    const failed = results.length - passed;
    resultsElement.dataset.total = String(results.length);
    resultsElement.dataset.passed = String(passed);
    resultsElement.dataset.failed = String(failed);
    resultsElement.textContent = JSON.stringify({ total: results.length, passed, failed, results }, null, 2);
    document.documentElement.setAttribute("data-test-complete", "true");
  }
  const resultsElement = document.getElementById("results");
  driveApp.addEventListener("kitwork:load", () => window.__driveStats.loads++);
  kit.start();

  (async function () {
    await tick(30);
    assert("drive service installed", typeof kit.drive.visit === "function" && kit.drive.enabled(driveApp));
    assert("counter initial state", counterValue.textContent === "5", counterValue.textContent);
    const componentBefore = kit.dev.inspect(counter).component.instance;
    const persistBefore = persist;

    counterInc.click();
    await tick();
    assert("counter increments before navigation", counterValue.textContent === "6", counterValue.textContent);

    persistBefore.textContent = "Client persistent state";
    draft.value = "client draft";
    draft.dispatchEvent(new Event("input", { bubbles: true }));
    draft.focus();
    draft.setSelectionRange(2, 8);
    await tick();

    await kit.drive.visit("/test/fixtures/drive-page2.html", { app: driveApp, fallback: false });
    await tick(30);

    const counterAfter = document.getElementById("counter");
    const inputAfter = document.getElementById("draft");
    assert("title reconciled", document.title === "Drive Page Two", document.title);
    assert("body content morphed", document.getElementById("heading").textContent === "Page Two");
    assert("component instance preserved", kit.dev.inspect(counterAfter).component.instance === componentBefore);
    assert("component state preserved over SSR seed", document.getElementById("counterValue").textContent === "6", document.getElementById("counterValue").textContent);
    assert("component not remounted", window.__driveStats.counterMounts === 1, String(window.__driveStats.counterMounts));
    assert("component not unmounted", window.__driveStats.counterUnmounts === 0, String(window.__driveStats.counterUnmounts));
    assert("removed component unmounted", window.__driveStats.removedUnmounts === 1, String(window.__driveStats.removedUnmounts));
    assert("new component mounted", window.__driveStats.newMounts === 1, String(window.__driveStats.newMounts));
    assert("new subtree hydrated", document.getElementById("newState").textContent === "new-mounted");
    assert("persist node identity preserved", document.getElementById("persist") === persistBefore);
    assert("persist node content preserved", persistBefore.textContent === "Client persistent state", persistBefore.textContent);
    assert("model draft preserved", inputAfter.value === "client draft", inputAfter.value);
    assert("model state rendered in new subtree", document.getElementById("draftText").textContent === "client draft");
    assert("focus preserved", document.activeElement === inputAfter, document.activeElement && document.activeElement.id);
    assert("selection preserved", inputAfter.selectionStart === 2 && inputAfter.selectionEnd === 8, `${inputAfter.selectionStart}:${inputAfter.selectionEnd}`);
    assert("load event emitted", window.__driveStats.loads >= 1, String(window.__driveStats.loads));
    assert("head metadata reconciled", document.querySelector('meta[name="description"]').content === "page two");
    assert("incoming inline script activated", window.__driveScriptRuns === 1, String(window.__driveScriptRuns));
    assert("history push requested", window.__historyCalls.some(call => call.type === "push" && call.url.indexOf("drive-page2.html") >= 0));

    const callsBeforePrefetch = window.__fetchCalls.length;
    await kit.drive.prefetch("/test/fixtures/drive-page3.html", { app: driveApp });
    const callsAfterPrefetch = window.__fetchCalls.length;
    assert("prefetch performs one request", callsAfterPrefetch === callsBeforePrefetch + 1, `${callsBeforePrefetch}:${callsAfterPrefetch}`);

    document.getElementById("toPage3").click();
    for (let i = 0; i < 80 && document.title !== "Drive Page Three"; i++) await tick(25);
    assert("link click intercepted", document.title === "Drive Page Three", document.title);
    assert("prefetch cache reused", window.__fetchCalls.length === callsAfterPrefetch, `${callsAfterPrefetch}:${window.__fetchCalls.length}`);
    assert("state remains after second morph", document.getElementById("counterValue").textContent === "6");
    assert("persistent identity remains after second morph", document.getElementById("persist") === persistBefore);

    await kit.drive.visit("/test/fixtures/drive-page2.html", { app: driveApp, fallback: false });
    await tick(20);
    const postForm = document.getElementById("postForm");
    postForm.dispatchEvent(new SubmitEvent("submit", { bubbles: true, cancelable: true, submitter: postForm.querySelector("button") }));
    for (let i = 0; i < 80 && document.title !== "Drive Page Three"; i++) await tick(25);
    const postOptions = window.__fetchOptions[window.__fetchOptions.length - 1];
    assert("POST form progressively enhanced", document.title === "Drive Page Three", document.title);
    assert("POST form uses FormData", postOptions.method === "POST" && postOptions.body instanceof FormData, postOptions.method);

    await kit.drive.visit("/test/fixtures/drive-page2.html", { app: driveApp, fallback: false });
    await tick(20);
    const form = document.getElementById("searchForm");
    form.dispatchEvent(new SubmitEvent("submit", { bubbles: true, cancelable: true, submitter: form.querySelector("button") }));
    for (let i = 0; i < 80 && document.title !== "Drive Page Three"; i++) await tick(25);
    assert("GET form progressively enhanced", document.title === "Drive Page Three", document.title);
    assert("GET form query serialized", window.__fetchCalls[window.__fetchCalls.length - 1].indexOf("q=kitwork") >= 0, window.__fetchCalls[window.__fetchCalls.length - 1]);

    finish();
  })().catch(error => {
    resultsElement.dataset.failed = "1";
    resultsElement.textContent = error.stack || String(error);
    document.documentElement.setAttribute("data-test-complete", "true");
  });
})();
</script>
</body>
</html>
