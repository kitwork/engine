<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="csrf-test-token">
  <script>
    window.KITWORK_RUNTIME_OPTIONS = { autoStart: false, development: true };
    window.__requests = [];
    window.fetch = function (url, options) {
      options = options || {};
      const signal = options.signal;
      return new Promise((resolve, reject) => {
        const delay = String(url).includes('slow') ? 60 : 5;
        const timer = setTimeout(() => {
          window.__requests.push({
            url: String(url),
            method: options.method || 'GET',
            csrf: options.headers && options.headers.get ? options.headers.get('X-CSRF-Token') : null,
            body: options.body || null
          });
          resolve(new Response(JSON.stringify({ ok: true, url: String(url) }), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          }));
        }, delay);
        if (signal) {
          if (signal.aborted) {
            clearTimeout(timer);
            reject(new DOMException('Aborted', 'AbortError'));
          } else {
            signal.addEventListener('abort', () => {
              clearTimeout(timer);
              reject(new DOMException('Aborted', 'AbortError'));
            }, { once: true });
          }
        }
      });
    };
  </script>
</head>
<body>
<main id="app" data-kit-app="main" data-kit-scope="requestDone: false;">
  <button id="requestButton" data-kit-click="kit.request.get('/from-expression')"></button>
  <div id="taskOwner" data-kit-component="task-owner">
    <span id="taskState" data-kit-text="state"></span>
  </div>
</main>
<pre id="results">pending</pre>
<script src="../dist/kitwork-runtime.js"></script>
<script>
(function () {
  const results = [];
  function assert(name, condition, details) {
    results.push({ name, passed: !!condition, details: details || '' });
    if (!condition) console.error('FAIL', name, details || '');
  }
  function tick(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

  kit.component('task-owner', {
    state: 'idle',
    startLatest(label, delay) {
      this.state = label;
      return kit.task.latest(this, 'search', async ({ signal }) => {
        await kit.task.delay(delay, { signal });
        this.state = label + ':done';
        return label;
      });
    },
    mount() {
      window.__taskInstance = this;
    }
  });
  kit.start();

  (async function () {
    await tick(15);
    assert('task service installed', typeof kit.task.latest === 'function');
    assert('request service installed', typeof kit.request.get === 'function');
    assert('request expression grant visible', typeof kit.internal.runtime.services.publicSurface.request.get === 'function');

    const first = window.__taskInstance.startLatest('first', 80).catch(error => error.name);
    await tick(5);
    const second = window.__taskInstance.startLatest('second', 10);
    const values = await Promise.all([first, second]);
    await tick(5);
    assert('task.latest aborts previous', values[0] === 'AbortError', JSON.stringify(values));
    assert('task.latest keeps newest result', values[1] === 'second');
    assert('component state reflects latest task', taskState.textContent === 'second:done', taskState.textContent);

    const getResult = await kit.request.get('/get');
    assert('request.get parses JSON', getResult.ok && getResult.data.ok === true);
    const postResult = await kit.request.post('/post', { value: 1 });
    assert('request.post parses JSON', postResult.ok && postResult.data.ok === true);
    const postCall = window.__requests.find(item => item.url.endsWith('/post'));
    assert('request adds CSRF to mutation', postCall && postCall.csrf === 'csrf-test-token', postCall && postCall.csrf);
    assert('request serializes JSON body', postCall && postCall.body === JSON.stringify({ value: 1 }), postCall && postCall.body);

    document.getElementById('requestButton').click();
    await tick(1);
    assert('expression request marks busy', requestButton.getAttribute('data-busy') === 'true');
    await tick(20);
    assert('expression request clears busy', !requestButton.hasAttribute('data-busy'));

    window.__ownerAbort = false;
    window.__taskInstance.startLatest('remove', 100).catch(error => {
      window.__ownerAbort = error && error.name === 'AbortError';
    });
    await tick(5);
    taskOwner.remove();
    await tick(25);
    assert('component unmount aborts owned tasks', window.__ownerAbort === true);

    const passed = results.filter(item => item.passed).length;
    const failed = results.length - passed;
    resultsEl.dataset.total = String(results.length);
    resultsEl.dataset.passed = String(passed);
    resultsEl.dataset.failed = String(failed);
    resultsEl.textContent = JSON.stringify({ total: results.length, passed, failed, results }, null, 2);
    document.documentElement.setAttribute('data-test-complete', 'true');
  })().catch(error => {
    resultsEl.dataset.failed = '1';
    resultsEl.textContent = error.stack || String(error);
    document.documentElement.setAttribute('data-test-complete', 'true');
  });

  var resultsEl = document.getElementById('results');
})();
</script>
</body>
</html>
