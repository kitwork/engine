<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS Menu</title>
</head>
<body class="min-h-screen bg-stone-100 px-6 py-16 text-stone-950">
  <main class="mx-auto max-w-2xl">
    <section class="rounded-3xl border border-stone-200 bg-white p-8 shadow-xl shadow-stone-300/40" data-kit-component="menu" data-kit-version="1.0.0">
      <div class="flex items-start justify-between gap-6">
        <div>
          <p class="text-sm font-semibold text-emerald-700">Custom menu button</p>
          <h1 class="mt-1 text-2xl font-bold tracking-tight">Tài khoản của bạn</h1>
          <p class="mt-2 text-sm leading-6 text-stone-600">Hỗ trợ Arrow Up/Down, Home, End, typeahead và Escape.</p>
        </div>

        <div class="relative">
          <button
            id="account-menu-trigger"
            class="inline-flex items-center gap-2 rounded-xl border border-stone-300 bg-white px-4 py-2.5 text-sm font-semibold shadow-sm transition hover:bg-stone-50 focus:outline-none focus:ring-4 focus:ring-emerald-100"
            type="button"
            aria-haspopup="menu"
            aria-controls="account-menu"
            data-menu-trigger
            data-kit-ref="trigger"
            data-kit-bind="aria-expanded: open;">
            Tùy chọn <span class="text-stone-400" aria-hidden="true">⌄</span>
          </button>

          <div
            id="account-menu"
            class="absolute right-0 z-20 mt-2 w-64 rounded-2xl border border-stone-200 bg-white p-1.5 shadow-2xl shadow-stone-300/60"
            role="menu"
            aria-labelledby="account-menu-trigger"
            data-kit-ref="menu"
            data-kit-show="open"
            hidden>
            <button
              class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm transition"
              type="button"
              role="menuitem"
              data-label="Hồ sơ"
              data-value="profile"
              data-kit-bind="tabindex: isActive(0) ? 0 : -1; aria-current: isSelected('profile') ? 'page' : null;"
              data-kit-class="isActive(0) ? 'bg-emerald-50 text-emerald-950' : 'text-stone-700 hover:bg-stone-50'">
              <span class="font-medium">Hồ sơ</span><span class="text-xs text-stone-400">P</span>
            </button>
            <button
              class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm transition"
              type="button"
              role="menuitem"
              data-label="Cài đặt"
              data-value="settings"
              data-kit-bind="tabindex: isActive(1) ? 0 : -1; aria-current: isSelected('settings') ? 'page' : null;"
              data-kit-class="isActive(1) ? 'bg-emerald-50 text-emerald-950' : 'text-stone-700 hover:bg-stone-50'">
              <span class="font-medium">Cài đặt</span><span class="text-xs text-stone-400">C</span>
            </button>
            <button
              class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm text-stone-400"
              type="button"
              role="menuitem"
              tabindex="-1"
              aria-disabled="true"
              disabled
              data-label="Thanh toán"
              data-value="billing">
              <span class="font-medium">Thanh toán</span><span class="text-xs">Sắp có</span>
            </button>
            <div class="my-1 border-t border-stone-100" role="separator"></div>
            <button
              class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm transition"
              type="button"
              role="menuitem"
              data-label="Đăng xuất"
              data-value="sign-out"
              data-kit-bind="tabindex: isActive(3) ? 0 : -1;"
              data-kit-class="isActive(3) ? 'bg-rose-50 text-rose-700' : 'text-rose-600 hover:bg-rose-50'">
              <span class="font-medium">Đăng xuất</span><span class="text-xs text-rose-400">Đ</span>
            </button>
          </div>
        </div>
      </div>

      <div class="mt-10 rounded-2xl bg-stone-50 p-5">
        <p class="text-xs font-semibold uppercase tracking-wider text-stone-500">Lựa chọn gần nhất</p>
        <p class="mt-2 text-sm font-medium text-stone-900" data-kit-text="selected ? selected : 'Chưa có lựa chọn'">Chưa có lựa chọn</p>
      </div>
    </section>
  </main>

  <script src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script src="./1.0.0.js"></script>
  <script src="../../core/boot.js"></script>
</body>
</html>
