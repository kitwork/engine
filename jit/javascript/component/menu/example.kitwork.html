<!-- ============================================================================ -->
<!-- Kitwork Component Example: Headless Menu (Draft 0.5 Compliant)              -->
<!-- Location: engine/jit/javascript/component/menu/example.kitwork.html         -->
<!-- ============================================================================ -->

<div data-kit-component="menu"
     data-kit-click:outside="$component.close()"
     class="relative inline-block">
  
  <button data-kit-click="$component.toggle()"
          data-kit-keydown:down="$component.navigate('next', 3)"
          data-kit-keydown:up="$component.navigate('prev', 3)"
          data-kit-bind="
              role: 'button';
              'aria-haspopup': true;
              'aria-expanded': open;
          "
          class="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-medium">
    Thao tác Menu
  </button>

  <ul role="menu"
      data-kit-show="open"
      data-kit-keydown:escape="$component.close()"
      class="absolute left-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 py-1 z-50">
    <li role="menuitem" data-kit-class="activeIndex === 0 ? 'bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600' : ''" class="px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 cursor-pointer">Chỉnh sửa</li>
    <li role="menuitem" data-kit-class="activeIndex === 1 ? 'bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600' : ''" class="px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 cursor-pointer">Sao chép</li>
    <li role="menuitem" data-kit-class="activeIndex === 2 ? 'bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600' : ''" class="px-4 py-2 text-sm text-red-600 hover:bg-red-50 cursor-pointer">Xóa bỏ</li>
  </ul>
</div>
