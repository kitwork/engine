<!-- ============================================================================ -->
<!-- Kitwork Component Example: Clipboard Copy Button                           -->
<!-- Location: engine/jit/javascript/component/clipboard/example.kitwork.html  -->
<!-- ============================================================================ -->

<div data-kit-component="clipboard" class="inline-block">
  <button data-kit-click="copy('npm install kitwork')"
          data-kit-class="bg-emerald-600 text-white: copied; bg-slate-800 hover:bg-slate-700 text-white: !copied;"
          class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition duration-200">
    
    <!-- Icon đổi theo trạng thái copied -->
    <i data-kit-class="icon-check: copied; icon-copy: !copied;" class="w-4 h-4"></i>
    <span data-kit-text="copied ? 'Đã sao chép!' : 'Sao chép Lệnh'"></span>
  </button>
</div>
