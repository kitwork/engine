<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS clipboard component</title>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-2xl items-center px-6 py-16">
    <section
      data-kit-component="clipboard"
      data-kit-as="$clipboard"
      class="w-full rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-2xl shadow-black/20">

      <p class="text-xs font-semibold uppercase tracking-widest text-indigo-400">
        KitJS component
      </p>
      <h1 class="mt-2 text-2xl font-bold tracking-tight text-white">
        Copy a command
      </h1>
      <p class="mt-2 text-sm leading-6 text-slate-400">
        This page loads the kernel, clipboard service, component, and boot file
        as ordinary browser scripts.
      </p>

      <label for="command" class="mt-6 block text-sm font-medium text-slate-300">
        Command
      </label>
      <textarea
        id="command"
        data-kit-ref="command"
        rows="3"
        class="mt-2 w-full resize-none rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 font-mono text-sm text-slate-100 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20">go run .</textarea>

      <div class="mt-4 flex flex-wrap items-center gap-3">
        <button
          type="button"
          data-kit-click="copy($refs.command.value)"
          data-kit-class="copied ? 'bg-emerald-500 hover:bg-emerald-400' : 'bg-indigo-600 hover:bg-indigo-500'"
          class="rounded-lg px-4 py-2 text-sm font-semibold text-white transition data-[busy=true]:cursor-wait data-[busy=true]:opacity-60">
          <span data-kit-text="copied ? 'Copied' : 'Copy command'">Copy command</span>
        </button>

        <button
          type="button"
          data-kit-click="reset()"
          class="rounded-lg border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-300 transition hover:border-slate-600 hover:bg-slate-800 hover:text-white">
          Reset
        </button>

        <span
          data-kit-show="copied"
          class="text-sm font-medium text-emerald-400"
          role="status"
          aria-live="polite">
          Clipboard updated.
        </span>
      </div>

      <p
        data-kit-show="error"
        data-kit-text="error"
        class="mt-4 rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-sm text-rose-300"
        role="alert">
      </p>
    </section>
  </main>

  <script src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script src="../../service/clipboard/1.0.0.js"></script>
  <script src="./1.0.0.js"></script>
  <script src="../../core/boot.js"></script>
</body>
</html>
