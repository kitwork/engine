<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS counter component</title>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-xl items-center justify-center px-6 py-16">
    <section
      data-kit-component="counter"
      class="w-full rounded-3xl border border-slate-800 bg-slate-900 p-8 text-center shadow-2xl shadow-black/30">
      <p class="text-sm font-semibold uppercase tracking-widest text-indigo-300">KitJS counter</p>
      <output
        data-kit-text="count"
        aria-live="polite"
        class="mt-5 block text-7xl font-black tracking-tight text-white">0</output>
      <div class="mt-7 flex items-center justify-center gap-3">
        <button
          type="button"
          data-kit-click="count = count - 1"
          class="rounded-xl border border-slate-700 bg-slate-950 px-5 py-3 text-base font-bold text-slate-100 transition hover:border-indigo-400 hover:text-indigo-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
          Decrease
        </button>
        <button
          type="button"
          data-kit-click="count = 0"
          class="rounded-xl px-5 py-3 text-base font-semibold text-slate-400 transition hover:bg-slate-800 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
          Reset
        </button>
        <button
          type="button"
          data-kit-click="count = count + 1"
          class="rounded-xl bg-indigo-500 px-5 py-3 text-base font-bold text-white transition hover:bg-indigo-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300">
          Increase
        </button>
      </div>
    </section>
  </main>

  <script src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script src="./1.0.0.js"></script>
  <script src="../../core/boot.js"></script>
</body>
</html>
