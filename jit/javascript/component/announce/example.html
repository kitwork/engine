<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS Announce</title>
</head>
<body class="min-h-screen bg-sky-50 px-6 py-16 text-slate-950">
  <main class="mx-auto max-w-2xl">
    <section class="rounded-3xl border border-sky-100 bg-white p-8 shadow-xl shadow-sky-200/50" data-kit-component="announce" data-kit-version="1.0.0">
      <p class="text-sm font-semibold text-sky-700">Accessible feedback</p>
      <h1 class="mt-1 text-2xl font-bold tracking-tight">Thông báo cho trình đọc màn hình</h1>
      <p class="mt-3 text-sm leading-6 text-slate-600">Component giữ state rất nhỏ và chuyển việc quản lý live region cho service announce@1.0.0.</p>

      <div class="mt-7 grid gap-3 sm:grid-cols-2">
        <button
          class="rounded-xl bg-sky-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-200 transition hover:bg-sky-700 focus:outline-none focus:ring-4 focus:ring-sky-200"
          type="button"
          data-kit-click="speak('Đã lưu thay đổi của bạn', 'polite')">Thông báo nhẹ nhàng</button>
        <button
          class="rounded-xl bg-rose-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-rose-200 transition hover:bg-rose-700 focus:outline-none focus:ring-4 focus:ring-rose-200"
          type="button"
          data-kit-click="speak('Không thể hoàn tất yêu cầu', 'assertive')">Thông báo khẩn cấp</button>
      </div>

      <div class="mt-6 rounded-2xl border border-slate-200 bg-slate-50 p-5" aria-hidden="true">
        <div class="flex items-center justify-between gap-4">
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Bản xem trước trực quan</p>
          <span
            class="rounded-full px-2.5 py-1 text-xs font-semibold"
            data-kit-text="mode"
            data-kit-class="mode === 'assertive' ? 'bg-rose-100 text-rose-700' : 'bg-sky-100 text-sky-700'">polite</span>
        </div>
        <p class="mt-3 min-h-6 text-sm font-medium text-slate-900" data-kit-text="message ? message : 'Chưa có thông báo'">Chưa có thông báo</p>
      </div>

      <button
        class="mt-5 text-sm font-semibold text-slate-500 underline decoration-slate-300 underline-offset-4 transition hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500"
        type="button"
        data-kit-click="clear()">Xóa thông báo</button>
    </section>
  </main>

  <script src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script src="../../service/announce/1.0.0.js"></script>
  <script src="./1.0.0.js"></script>
  <script src="../../core/boot.js"></script>
</body>
</html>
