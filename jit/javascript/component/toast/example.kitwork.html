<!-- ============================================================================ -->
<!-- Kitwork Component Example: Toast Notification (Draft 0.5 Compliant)         -->
<!-- Location: engine/jit/javascript/component/toast/example.kitwork.html        -->
<!-- ============================================================================ -->

<!-- 1. Hộp Toast thông báo tự động ẩn sau 3 giây (Đăng ký Direct Alias $toastNotification) -->
<div data-kit-component="toast"
     data-kit-as="$toastNotification"
     data-kit-show="visible"
     data-kit-data="type: type;"
     class="fixed bottom-6 right-6 z-50 p-4 bg-slate-900 text-white rounded-xl shadow-2xl border border-slate-800 flex items-center gap-3 transition-all duration-300">
  
  <span data-kit-text="message" class="text-sm font-medium"></span>

  <button data-kit-click="$component.close()" class="text-slate-400 hover:text-white p-1">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
  </button>
</div>

<!-- 2. Các nút kích hoạt Toast thông qua $toastNotification.show() -->
<div class="p-6 flex gap-3">
  <button data-kit-click="$toastNotification.show('Dữ liệu đã được lưu thành công!', 'success')"
          class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium">
    Bật Success Toast
  </button>

  <button data-kit-click="$toastNotification.show('Không thể kết nối đến máy chủ!', 'error')"
          class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium">
    Bật Error Toast
  </button>
</div>
