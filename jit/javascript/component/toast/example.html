<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS toast component</title>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto flex min-h-screen max-w-3xl items-center px-6 py-16">
    <section class="w-full rounded-3xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-300/40">
      <p class="text-xs font-semibold uppercase tracking-widest text-violet-600">KitJS component</p>
      <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-950">Owned toast timers</h1>
      <p class="mt-3 max-w-xl text-sm leading-6 text-slate-600">
        Each instance owns and cleans up its timer. A duration of zero keeps the notification visible until it is closed.
      </p>

      <div class="mt-7 flex flex-wrap gap-3">
        <button
          type="button"
          data-kit-click="$toast.show('Your changes were saved.', 'success', 3500)"
          class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
          Show success
        </button>
        <button
          type="button"
          data-kit-click="$toast.show('The request could not be completed.', 'error', 5000)"
          class="rounded-xl bg-rose-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-rose-500 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2">
          Show error
        </button>
        <button
          type="button"
          data-kit-click="$toast.show('Maintenance begins at 22:00.', 'warning', 0)"
          class="rounded-xl bg-amber-500 px-4 py-2 text-sm font-semibold text-amber-950 transition hover:bg-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2">
          Show persistent
        </button>
      </div>
    </section>
  </main>

  <aside
    data-kit-component="toast"
    data-kit-as="$toast"
    data-kit-show="visible"
    data-kit-bind="data-tone: tone;"
    data-kit-class="tone === 'success' ? 'border-emerald-400 bg-emerald-950 text-emerald-50' : tone === 'error' ? 'border-rose-400 bg-rose-950 text-rose-50' : tone === 'warning' ? 'border-amber-400 bg-amber-950 text-amber-50' : 'border-sky-400 bg-sky-950 text-sky-50'"
    aria-label="Notification"
    hidden
    class="fixed bottom-6 left-6 right-6 z-50 rounded-2xl border p-4 shadow-2xl shadow-slate-950/30 sm:left-auto sm:w-96">
    <div class="flex items-start gap-3">
      <div class="min-w-0 flex-1">
        <p data-kit-text="tone" class="text-xs font-bold uppercase tracking-widest">info</p>
        <p data-kit-text="message" class="mt-1 text-sm font-medium leading-6"></p>
        <p data-kit-text="duration === 0 ? 'Persistent' : duration + ' ms'" class="mt-1 text-xs opacity-70"></p>
      </div>
      <button
        type="button"
        aria-label="Dismiss notification"
        data-kit-click="close()"
        class="rounded-lg p-1.5 opacity-70 transition hover:bg-white/10 hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-white/70">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="h-4 w-4">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
  </aside>

  <script src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script src="../../service/announce/1.0.0.js"></script>
  <script src="./1.0.0.js"></script>
  <script src="../../core/boot.js"></script>
</body>
</html>
