<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS popover component</title>
</head>
<body class="min-h-screen bg-slate-100 text-slate-950 dark:bg-slate-950 dark:text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-xl items-center justify-center px-6 py-16">
    <section
      data-kit-component="popover"
      data-kit-click:outside="open = false"
      data-kit-keydown:escape="open = false"
      class="relative">
      <button
        id="popover-trigger"
        type="button"
        data-kit-ref="trigger"
        aria-controls="popover-panel"
        aria-expanded="false"
        data-kit-click="open = !open"
        data-kit-bind="'aria-expanded': open;"
        class="rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-slate-950">
        Inspect deployment
      </button>

      <div
        id="popover-panel"
        role="region"
        aria-labelledby="popover-trigger"
        data-kit-show="open"
        hidden
        class="absolute left-1/2 top-full z-50 mt-3 w-80 -translate-x-1/2 rounded-2xl border border-slate-200 bg-white p-5 shadow-2xl shadow-slate-900/20 outline-none dark:border-slate-700 dark:bg-slate-900">
        <p class="text-xs font-semibold uppercase tracking-widest text-emerald-600 dark:text-emerald-400">Generation ready</p>
        <h1 class="mt-2 text-base font-bold">The closed module graph passed validation.</h1>
        <p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300">Click outside or press Escape to close this custom panel.</p>
        <button
          type="button"
          data-kit-click="open = false"
          class="mt-4 rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">
          Close
        </button>
      </div>
    </section>
  </main>

  <script src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script src="./1.0.0.js"></script>
  <script src="../../core/boot.js"></script>
</body>
</html>
