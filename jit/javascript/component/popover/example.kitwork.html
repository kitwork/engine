<!-- ============================================================================ -->
<!-- Kitwork Component Example: Popover Panel (Draft 0.5 Compliant)              -->
<!-- Location: engine/jit/javascript/component/popover/example.kitwork.html      -->
<!-- ============================================================================ -->

<div data-kit-component="popover"
     data-kit-click:outside="$component.close()"
     class="relative inline-block">
  
  <button data-kit-click="$component.toggle()"
          data-kit-bind="
              'aria-expanded': open;
              'aria-controls': 'popover-panel';
          "
          class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
    Chi tiết thông tin
  </button>

  <div id="popover-panel"
       data-kit-show="open"
       data-kit-keydown:escape:window="$component.close()"
       class="absolute left-0 mt-2 w-72 p-4 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 z-50">
    <h4 class="font-bold text-slate-800 dark:text-slate-100 text-sm mb-1">Thông tin chi tiết</h4>
    <p class="text-xs text-slate-600 dark:text-slate-400">Đây là bảng thông tin Popover dạng Headless Behavior với tính năng tự đóng khi click ngoài hoặc bấm Escape.</p>
  </div>
</div>
