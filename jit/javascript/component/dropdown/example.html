<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS dropdown component</title>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-xl items-center justify-center px-6 py-16">
    <section
      data-kit-component="dropdown"
      data-kit-click:outside="open = false"
      data-kit-keydown:escape="open = false"
      class="relative inline-block text-left">
      <button
        id="dropdown-trigger"
        type="button"
        data-kit-ref="trigger"
        aria-controls="dropdown-panel"
        aria-expanded="false"
        data-kit-click="open = !open"
        data-kit-bind="'aria-expanded': open;"
        class="inline-flex items-center gap-3 rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-sm font-semibold text-white shadow-xl shadow-black/20 transition hover:border-slate-600 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        Workspace actions
        <span
          aria-hidden="true"
          data-kit-class="open ? 'rotate-180 text-indigo-300' : 'rotate-0 text-slate-500'"
          class="text-lg transition-transform">&#9662;</span>
      </button>

      <div
        id="dropdown-panel"
        role="region"
        aria-labelledby="dropdown-trigger"
        data-kit-show="open"
        hidden
        class="absolute right-0 z-50 mt-3 w-64 overflow-hidden rounded-2xl border border-slate-700 bg-slate-900 p-2 shadow-2xl shadow-black/30">
        <a
          href="/settings"
          class="flex w-full items-center rounded-xl px-3 py-2.5 text-left text-sm text-slate-200 transition hover:bg-slate-800 focus:bg-slate-800 focus:outline-none">
          Open project settings
        </a>
        <a
          href="/collaborators"
          class="flex w-full items-center rounded-xl px-3 py-2.5 text-left text-sm text-slate-200 transition hover:bg-slate-800 focus:bg-slate-800 focus:outline-none">
          Invite a collaborator
        </a>
        <div class="my-2 border-t border-slate-800"></div>
        <a
          href="/workspaces"
          class="flex w-full items-center rounded-xl px-3 py-2.5 text-left text-sm text-rose-300 transition hover:bg-rose-500/10 focus:bg-rose-500/10 focus:outline-none">
          Switch workspace
        </a>
      </div>
    </section>
  </main>

  <script src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script src="./1.0.0.js"></script>
  <script src="../../core/boot.js"></script>
</body>
</html>
