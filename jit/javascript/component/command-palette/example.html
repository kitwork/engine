<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS Command Palette</title>
</head>
<body class="min-h-screen bg-slate-950 px-6 py-16 text-white">
  <main class="mx-auto max-w-3xl">
    <section data-kit-component="command-palette" data-kit-version="1.0.0">
      <div class="rounded-3xl border border-slate-800 bg-slate-900 p-8 shadow-2xl shadow-black/30">
        <p class="text-sm font-semibold text-violet-400">Custom overlay</p>
        <h1 class="mt-2 text-3xl font-bold tracking-tight">Điều hướng nhanh bằng bàn phím</h1>
        <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-400">Mở bảng lệnh, tìm kiếm rồi dùng phím mũi tên và Enter. Focus được giữ bên trong overlay và trả về đúng vị trí khi đóng.</p>
        <button
          class="mt-7 inline-flex items-center gap-3 rounded-xl bg-white px-4 py-3 text-sm font-semibold text-slate-950 shadow-lg transition hover:bg-violet-50 focus:outline-none focus:ring-4 focus:ring-violet-500/40"
          type="button"
          data-command-trigger>
          Mở bảng lệnh
          <span class="rounded-md border border-slate-300 bg-slate-100 px-2 py-0.5 text-xs text-slate-500">Ctrl / ⌘ K</span>
        </button>
      </div>

      <div
        class="fixed inset-0 z-50 flex items-start justify-center bg-slate-950/70 px-4 pt-20 backdrop-blur-sm sm:pt-28"
        data-command-backdrop
        data-kit-show="open"
        data-kit-bind="aria-hidden: !open;"
        hidden>
        <section
          class="w-full max-w-2xl overflow-hidden rounded-2xl border border-slate-700 bg-slate-900 shadow-2xl shadow-black/60"
          role="dialog"
          aria-modal="true"
          aria-labelledby="command-title"
          data-kit-ref="panel">
          <div class="flex items-center gap-3 border-b border-slate-800 px-4">
            <span class="text-xl text-slate-500" aria-hidden="true">⌕</span>
            <input
              id="command-search"
              class="min-w-0 flex-1 bg-transparent py-4 text-base text-white outline-none placeholder:text-slate-500"
              type="text"
              autocomplete="off"
              placeholder="Tìm lệnh..."
              role="combobox"
              aria-autocomplete="list"
              aria-controls="command-list"
              data-kit-ref="input"
              data-kit-model="query"
              data-kit-bind="aria-expanded: open; aria-activedescendant: activeId;">
            <button
              class="rounded-lg px-2 py-1 text-xs font-medium text-slate-400 transition hover:bg-slate-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-violet-500"
              type="button"
              data-kit-click="close()">Esc</button>
          </div>

          <h2 id="command-title" class="sr-only">Bảng lệnh</h2>
          <div id="command-list" class="max-h-80 overflow-y-auto p-2" role="listbox">
            <button
              id="command-project"
              class="flex w-full items-center justify-between rounded-xl px-3 py-3 text-left text-sm transition"
              type="button"
              tabindex="-1"
              role="option"
              data-command
              data-label="Tạo dự án mới"
              data-keywords="new create project"
              data-value="new-project"
              data-kit-show="matches('Tạo dự án mới', 'new create project')"
              data-kit-bind="aria-selected: isActive(0);"
              data-kit-class="isActive(0) ? 'bg-violet-500/20 text-violet-100' : 'text-slate-300 hover:bg-slate-800'">
              <span class="font-medium">Tạo dự án mới</span><span class="text-xs text-slate-500">N</span>
            </button>
            <button
              id="command-docs"
              class="flex w-full items-center justify-between rounded-xl px-3 py-3 text-left text-sm transition"
              type="button"
              tabindex="-1"
              role="option"
              data-command
              data-label="Tìm kiếm tài liệu"
              data-keywords="search docs help"
              data-value="search-docs"
              data-kit-show="matches('Tìm kiếm tài liệu', 'search docs help')"
              data-kit-bind="aria-selected: isActive(1);"
              data-kit-class="isActive(1) ? 'bg-violet-500/20 text-violet-100' : 'text-slate-300 hover:bg-slate-800'">
              <span class="font-medium">Tìm kiếm tài liệu</span><span class="text-xs text-slate-500">S</span>
            </button>
            <button
              id="command-theme"
              class="flex w-full items-center justify-between rounded-xl px-3 py-3 text-left text-sm transition"
              type="button"
              tabindex="-1"
              role="option"
              data-command
              data-label="Đổi giao diện"
              data-keywords="theme dark light appearance"
              data-value="change-theme"
              data-kit-show="matches('Đổi giao diện', 'theme dark light appearance')"
              data-kit-bind="aria-selected: isActive(2);"
              data-kit-class="isActive(2) ? 'bg-violet-500/20 text-violet-100' : 'text-slate-300 hover:bg-slate-800'">
              <span class="font-medium">Đổi giao diện</span><span class="text-xs text-slate-500">T</span>
            </button>
            <p class="px-3 py-10 text-center text-sm text-slate-500" data-kit-show="open && !hasMatches">Không có lệnh phù hợp.</p>
          </div>

          <div class="flex items-center justify-between border-t border-slate-800 px-4 py-3 text-xs text-slate-500">
            <span>↑ ↓ để di chuyển</span><span>Enter để chọn · Esc để đóng</span>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script src="./1.0.0.js"></script>
  <script src="../../core/boot.js"></script>
</body>
</html>
