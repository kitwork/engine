<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS drawer component</title>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-3xl items-center px-6 py-16">
    <section class="w-full rounded-3xl border border-slate-800 bg-slate-900 p-8 shadow-2xl shadow-black/30">
      <p class="text-xs font-semibold uppercase tracking-widest text-cyan-400">KitJS component</p>
      <h1 class="mt-2 text-3xl font-bold tracking-tight text-white">Custom navigation drawer</h1>
      <p class="mt-3 max-w-xl text-sm leading-6 text-slate-400">
        A div-based drawer with a backdrop, Escape handling, focus trapping, and safe focus restoration.
      </p>

      <button
        type="button"
        aria-controls="kit-drawer-panel"
        aria-haspopup="dialog"
        data-kit-bind="aria-expanded: $drawer.open;"
        data-kit-click="$drawer.show('Workspace navigation')"
        class="mt-7 rounded-xl bg-cyan-500 px-5 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 focus:ring-offset-slate-900">
        Open navigation
      </button>
    </section>
  </main>

  <section
    data-kit-component="drawer"
    data-kit-as="$drawer"
    data-kit-show="open"
    hidden
    class="fixed inset-0 z-50 flex">
    <button
      type="button"
      tabindex="-1"
      aria-label="Close navigation drawer"
      data-kit-click="close()"
      class="absolute inset-0 h-full w-full cursor-default border-0 bg-slate-950/70 p-0 backdrop-blur-sm">
    </button>

    <aside
      id="kit-drawer-panel"
      data-kit-ref="panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="kit-drawer-title"
      tabindex="-1"
      class="relative flex h-full w-80 max-w-[88vw] flex-col border-r border-slate-200 bg-white p-6 text-slate-900 shadow-2xl outline-none">
      <div class="flex items-center justify-between gap-4 border-b border-slate-200 pb-5">
        <h2 id="kit-drawer-title" data-kit-text="title" class="text-lg font-bold text-slate-950">Navigation</h2>
        <button
          type="button"
          aria-label="Close navigation drawer"
          data-kit-click="close()"
          class="rounded-lg p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 focus:outline-none focus:ring-2 focus:ring-cyan-500">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>

      <nav aria-label="Workspace" class="mt-6 flex-1 space-y-2">
        <a href="#overview" data-kit-click="close()" class="block rounded-xl bg-cyan-50 px-4 py-3 text-sm font-semibold text-cyan-800 focus:outline-none focus:ring-2 focus:ring-cyan-500">Overview</a>
        <a href="#projects" data-kit-click="close()" class="block rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 focus:outline-none focus:ring-2 focus:ring-cyan-500">Projects</a>
        <a href="#settings" data-kit-click="close()" class="block rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 focus:outline-none focus:ring-2 focus:ring-cyan-500">Settings</a>
      </nav>

      <p class="border-t border-slate-200 pt-5 text-xs leading-5 text-slate-500">
        Press Escape or activate the backdrop to close this drawer.
      </p>
    </aside>
  </section>

  <script src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script src="./1.0.0.js"></script>
  <script src="../../core/boot.js"></script>
</body>
</html>
