<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS dialog component</title>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto flex min-h-screen max-w-2xl items-center px-6 py-16">
    <section class="w-full rounded-3xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-300/40">
      <p class="text-xs font-semibold uppercase tracking-widest text-indigo-600">KitJS component</p>
      <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-950">Custom accessible dialog</h1>
      <p class="mt-3 max-w-xl text-sm leading-6 text-slate-600">
        The component owns Escape handling, focus trapping, and focus restoration without using the native dialog element.
      </p>

      <button
        type="button"
        aria-controls="kit-dialog-panel"
        aria-haspopup="dialog"
        data-kit-bind="aria-expanded: $dialog.open;"
        data-kit-click="$dialog.show('Publish this release?', 'The new KitJS bundle will become available to every visitor.')"
        class="mt-7 rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
        Review release
      </button>
    </section>
  </main>

  <section
    data-kit-component="dialog"
    data-kit-as="$dialog"
    data-kit-show="open"
    hidden
    class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <button
      type="button"
      tabindex="-1"
      aria-label="Close dialog"
      data-kit-click="close()"
      class="absolute inset-0 h-full w-full cursor-default border-0 bg-slate-950/60 p-0 backdrop-blur-sm">
    </button>

    <div
      id="kit-dialog-panel"
      data-kit-ref="panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="kit-dialog-title"
      aria-describedby="kit-dialog-description"
      tabindex="-1"
      class="relative w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl outline-none">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="text-xs font-semibold uppercase tracking-widest text-indigo-600">Confirmation</p>
          <h2 id="kit-dialog-title" data-kit-text="title" class="mt-2 text-xl font-bold text-slate-950">Dialog</h2>
        </div>
        <button
          type="button"
          aria-label="Close dialog"
          data-kit-click="close()"
          class="rounded-lg p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>

      <p id="kit-dialog-description" data-kit-text="message" class="mt-4 text-sm leading-6 text-slate-600"></p>

      <div class="mt-7 flex justify-end gap-3">
        <button
          type="button"
          data-kit-click="close()"
          class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          Cancel
        </button>
        <button
          type="button"
          data-kit-click="close()"
          class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
          Publish
        </button>
      </div>
    </div>
  </section>

  <script src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script src="./1.0.0.js"></script>
  <script src="../../core/boot.js"></script>
</body>
</html>
