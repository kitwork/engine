<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS progress-bar component</title>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto flex min-h-screen max-w-2xl items-center px-6 py-16">
    <div class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-300/40">
      <p class="text-xs font-semibold uppercase tracking-widest text-indigo-600">
        KitJS component
      </p>
      <h1 class="mt-2 text-2xl font-bold tracking-tight text-slate-950">
        Progress without a service
      </h1>
      <p class="mt-2 text-sm leading-6 text-slate-600">
        Value, status, and visibility belong to the component because they are
        reactive UI state.
      </p>

      <section
        data-kit-component="progress-bar"
        data-kit-as="$progress"
        class="mt-7">

        <div data-kit-show="!hidden" class="space-y-2">
          <div class="flex items-center justify-between text-sm">
            <span data-kit-text="status" class="font-medium capitalize text-slate-700">idle</span>
            <span data-kit-text="value + '%'" class="font-mono font-semibold text-slate-950">0%</span>
          </div>

          <div
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            data-kit-bind="aria-valuenow: value;"
            class="h-3 overflow-hidden rounded-full bg-slate-200">
            <div
              data-kit-style="width: width;"
              data-kit-class="status === 'completed' ? 'bg-emerald-500' : 'bg-indigo-600'"
              class="h-full rounded-full transition-all duration-300">
            </div>
          </div>
        </div>

        <div data-kit-show="hidden" class="rounded-xl border border-dashed border-slate-300 px-4 py-5 text-center text-sm text-slate-500">
          Start the component to reveal its progress.
        </div>
      </section>

      <div class="mt-6 flex flex-wrap gap-2">
        <button
          type="button"
          data-kit-click="$progress.start()"
          class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-500">
          Start
        </button>
        <button
          type="button"
          data-kit-click="$progress.inc(10)"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-indigo-300 hover:text-indigo-700">
          Add 10%
        </button>
        <button
          type="button"
          data-kit-click="$progress.done()"
          class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-500">
          Complete
        </button>
        <button
          type="button"
          data-kit-click="$progress.reset()"
          class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-500 transition hover:bg-slate-100 hover:text-slate-900">
          Reset
        </button>
      </div>
    </div>
  </main>

  <script src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script src="./1.0.0.js"></script>
  <script src="../../core/boot.js"></script>
</body>
</html>
