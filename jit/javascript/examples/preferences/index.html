<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS · Sealed preferences</title>
  <link rel="stylesheet" href="../kitjs.examples.d5ec0a87f2bf45850ebc74f84b5ea6e49e3c6c97ef1a882813170afb1a60f3af.css">
  <script defer src="./kit.1.0.0-rc.2.75117b0bdf092dadc07c3990fde73c1f1380978fd18039349ce0c26724fc410d.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-8xl items-center justify-center px-6 py-12 sm:px-8 lg:px-12">
    <section
      data-kit-component="preferences@1.0.0"
      aria-labelledby="preferences-title"
      class="w-full max-w-xl rounded-3xl border border-slate-800 bg-slate-900 p-7 shadow-2xl shadow-black/30 sm:p-9">
      <p class="text-sm font-bold uppercase tracking-widest text-indigo-300">Sealed storage service</p>
      <h1 id="preferences-title" class="mt-3 text-3xl font-black tracking-tight text-white sm:text-4xl">Choose a theme preference</h1>
      <p class="mt-3 text-base leading-7 text-slate-300">
        HTML calls only component methods. The component privately uses
        <code class="rounded bg-slate-800 px-1.5 py-0.5 text-indigo-200">kit.storage</code>.
      </p>

      <div class="mt-8 grid grid-cols-3 gap-3" role="group" aria-label="Theme preference">
        <button
          id="preferences-system"
          type="button"
          data-kit-click="choose('system')"
          data-kit-bind:aria-pressed="mode === 'system'"
          data-kit-class="mode == 'system' ? 'border-indigo-400 bg-indigo-600 text-white' : 'border-slate-700 bg-slate-950 text-slate-300'"
          class="rounded-xl border px-4 py-3 text-sm font-bold transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-400">
          System
        </button>
        <button
          id="preferences-light"
          type="button"
          data-kit-click="choose('light')"
          data-kit-bind:aria-pressed="mode === 'light'"
          data-kit-class="mode == 'light' ? 'border-indigo-400 bg-indigo-600 text-white' : 'border-slate-700 bg-slate-950 text-slate-300'"
          class="rounded-xl border px-4 py-3 text-sm font-bold transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-400">
          Light
        </button>
        <button
          id="preferences-dark"
          type="button"
          data-kit-click="choose('dark')"
          data-kit-bind:aria-pressed="mode === 'dark'"
          data-kit-class="mode == 'dark' ? 'border-indigo-400 bg-indigo-600 text-white' : 'border-slate-700 bg-slate-950 text-slate-300'"
          class="rounded-xl border px-4 py-3 text-sm font-bold transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-400">
          Dark
        </button>
      </div>

      <div class="mt-7 flex items-center justify-between gap-4 rounded-2xl border border-slate-800 bg-slate-950 p-4">
        <div>
          <p class="text-xs font-bold uppercase tracking-widest text-slate-500">Current value</p>
          <output id="preferences-mode" data-kit-text="mode" class="mt-1 block text-lg font-black text-white">system</output>
          <p id="preferences-message" role="status" aria-live="polite" aria-atomic="true" data-kit-text="message" class="mt-1 text-sm text-slate-400">Loading saved preference…</p>
        </div>
        <button
          id="preferences-reset"
          type="button"
          data-kit-click="reset()"
          class="shrink-0 rounded-xl border border-slate-700 px-4 py-2 text-sm font-bold text-slate-200 transition-colors hover:border-slate-500 hover:bg-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-400">
          Reset
        </button>
      </div>
    </section>
  </main>
</body>
</html>
