<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS dropdown</title>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-xl items-center justify-center px-6 py-16">
    <section
      id="dropdown-demo"
      data-kit-component="dropdown"
      data-kit-click:outside="open = false"
      data-kit-keydown:escape="open = false"
      aria-labelledby="dropdown-title"
      class="relative w-full rounded-3xl border border-slate-800 bg-slate-900 p-8 shadow-2xl shadow-black/30">
      <h1 id="dropdown-title" class="mb-5 text-sm font-semibold uppercase tracking-widest text-indigo-300">
        KitJS dropdown
      </h1>

      <button
        id="dropdown-trigger"
        type="button"
        aria-controls="dropdown-menu"
        aria-expanded="false"
        data-kit-click="open = !open"
        data-kit-bind="'aria-expanded': open;"
        class="inline-flex w-full items-center justify-between gap-3 rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-left text-sm font-semibold text-white transition hover:border-indigo-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
        Workspace actions
        <span aria-hidden="true" class="text-indigo-300">&#9662;</span>
      </button>

      <nav
        id="dropdown-menu"
        aria-label="Workspace actions"
        data-kit-show="open"
        hidden
        class="absolute left-8 right-8 z-10 mt-3 overflow-hidden rounded-2xl border border-slate-700 bg-slate-950 p-2 shadow-2xl shadow-black/30">
        <a
          id="dropdown-settings"
          href="#settings"
          class="block rounded-xl px-3 py-2.5 text-sm text-slate-200 transition hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
          Project settings
        </a>
        <a
          id="dropdown-collaborators"
          href="#collaborators"
          class="block rounded-xl px-3 py-2.5 text-sm text-slate-200 transition hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
          Invite a collaborator
        </a>
      </nav>
    </section>
  </main>

  <script src="../kit.js"></script>
  <script>
    kit.component("dropdown", {
      open: false
    });
  </script>
</body>
</html>
