<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS external dialog command</title>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-xl items-center justify-center px-6 py-16">
    <section
      data-kit-component="dialog-source"
      aria-labelledby="dialog-demo-title"
      class="w-full rounded-3xl border border-slate-800 bg-slate-900 p-8 shadow-2xl shadow-black/30">
      <p class="text-sm font-semibold uppercase tracking-widest text-indigo-300">External component command</p>
      <h1 id="dialog-demo-title" class="mt-3 text-3xl font-black tracking-tight text-white">
        Open a dialog by alias
      </h1>
      <p class="mt-3 text-sm leading-6 text-slate-400">
        The source and dialog stay isolated. Only the boundary whose state changes is rendered.
      </p>

      <div class="mt-6 flex flex-wrap items-center gap-4">
        <button
          id="dialog-trigger"
          type="button"
          aria-controls="confirm-dialog"
          aria-haspopup="dialog"
          data-kit-click="$dialog.open(() => handleSuccess())"
          class="rounded-xl bg-indigo-500 px-5 py-3 text-sm font-bold text-white transition hover:bg-indigo-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300">
          Publish
        </button>
        <output id="dialog-result" data-kit-text="message" aria-live="polite" class="text-sm text-emerald-300">
          Nothing published yet.
        </output>
      </div>
    </section>
  </main>

  <div
    id="confirm-dialog"
    data-kit-component="confirm-dialog"
    data-kit-as="$dialog"
    data-kit-show="visible"
    data-kit-click:self="close()"
    data-kit-keydown:escape="close()"
    hidden
    class="fixed inset-0 z-50 grid place-items-center bg-slate-950/80 p-6">
    <section
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      class="w-full max-w-md rounded-3xl border border-slate-700 bg-slate-900 p-7 shadow-2xl shadow-black/50">
      <h2 id="confirm-dialog-title" class="text-xl font-bold text-white">Publish this change?</h2>
      <p class="mt-2 text-sm leading-6 text-slate-400">Confirming calls the callback in its original source component.</p>
      <div class="mt-6 flex justify-end gap-3">
        <button
          type="button"
          data-kit-click="close()"
          class="rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-300 transition hover:bg-slate-800 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-500">
          Cancel
        </button>
        <button
          id="dialog-confirm"
          type="button"
          data-kit-click="confirm()"
          class="rounded-xl bg-indigo-500 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-indigo-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300">
          Confirm
        </button>
      </div>
    </section>
  </div>

  <script src="../kit.js"></script>
  <script>
    kit.component("dialog-source", {
      message: "Nothing published yet.",
      handleSuccess: function () {
        this.message = "Published successfully."
      }
    });

    kit.component("confirm-dialog", {
      visible: false,
      callback: null,
      open: function (callback) {
        this.callback = callback;
        this.visible = true;
      },
      close: function () {
        this.callback = null;
        this.visible = false;
      },
      confirm: function () {
        var callback = this.callback;
        this.close();
        if (callback) callback();
      }
    });
  </script>
</body>
</html>
