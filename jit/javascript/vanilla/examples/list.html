<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitJS keyed list</title>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-3xl px-6 py-16">
    <section
      data-kit-component="task-list"
      aria-labelledby="list-title"
      class="rounded-3xl border border-slate-800 bg-slate-900 p-8 shadow-2xl shadow-black/30">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <p class="text-sm font-semibold uppercase tracking-widest text-indigo-300">KitJS structure</p>
          <h1 id="list-title" class="mt-2 text-3xl font-black tracking-tight text-white">A keyed task list</h1>
          <p class="mt-2 max-w-xl text-sm leading-6 text-slate-400">
            Check a row, then reverse the list. Its DOM state follows the keyed item.
          </p>
        </div>

        <div class="flex flex-wrap gap-3">
          <button
            type="button"
            data-kit-click="reorder()"
            class="rounded-xl border border-slate-700 px-4 py-2.5 text-sm font-bold text-slate-200 transition hover:border-indigo-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
            Reverse
          </button>
          <button
            type="button"
            data-kit-click="add()"
            class="rounded-xl bg-indigo-500 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-indigo-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300">
            Add task
          </button>
        </div>
      </div>

      <ul class="mt-8 grid gap-3" aria-live="polite">
        <template data-kit-if="items.length == 0">
          <li class="rounded-2xl border border-dashed border-slate-700 px-5 py-8 text-center text-sm text-slate-400">
            No tasks yet. Add one to begin.
          </li>
        </template>

        <template data-kit-for="item, index of items" data-kit-key="item.id">
          <li class="flex items-center gap-4 rounded-2xl border border-slate-800 bg-slate-950 px-5 py-4">
            <input
              type="checkbox"
              aria-label="Mark task locally"
              class="size-4 shrink-0 accent-indigo-500">
            <div class="min-w-0 flex-1">
              <p class="truncate font-semibold text-white" data-kit-text="item.title"></p>
              <p class="mt-1 text-xs text-slate-500">
                Row <span data-kit-text="index + 1"></span> · key <span data-kit-text="item.id"></span>
              </p>
            </div>
            <button
              type="button"
              data-kit-click="remove(item.id)"
              class="rounded-lg px-3 py-2 text-sm font-semibold text-rose-300 transition hover:bg-rose-500/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-400">
              Remove
            </button>
          </li>
        </template>
      </ul>
    </section>
  </main>

  <script src="../kit.js"></script>
  <script>
    kit.component("task-list", {
      nextId: 4,
      items: [
        { id: 1, title: "Define the component" },
        { id: 2, title: "Render keyed rows" },
        { id: 3, title: "Keep the API small" }
      ],

      add() {
        const id = this.nextId;
        this.nextId = id + 1;
        this.items = this.items.concat([{ id, title: "Task " + id }]);
      },

      reorder() {
        this.items = this.items.slice().reverse();
      },

      remove(id) {
        this.items = this.items.filter((item) => item.id !== id);
      }
    });
  </script>
</body>
</html>
