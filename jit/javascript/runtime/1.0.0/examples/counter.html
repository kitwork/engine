<!doctype html>
<html lang="en" data-kit-app="main">
<head>
  <meta charset="utf-8">
  <title>Kitwork Runtime Counter</title>
</head>
<body>
  <main data-kit-component="counter" data-kit-as="$counter" data-kit-scope="count: 0;">
    <button data-kit-click="$component.decrement()">−</button>
    <output data-kit-text="count">0</output>
    <button data-kit-click="$component.increment()">+</button>
  </main>

  <button data-kit-click="$counter.reset()">Reset from outside</button>

  <script>
    window.KITWORK_RUNTIME_OPTIONS = { autoStart: false, development: true };
  </script>
  <script src="../dist/kitwork-runtime.js"></script>
  <script>
    kit.component("counter", {
      count: 0,
      increment() { this.count = this.count + 1; },
      decrement() { this.count = this.count - 1; },
      reset() { this.count = 0; }
    });
    kit.start();
  </script>
</body>
</html>
