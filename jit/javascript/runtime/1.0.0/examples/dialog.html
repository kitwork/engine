<!doctype html>
<html lang="en" data-kit-app="main">
<head>
  <meta charset="utf-8">
  <title>Kitwork 1.0 — Payment Dialog Example</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #090d16; color: #f3f4f6; padding: 2rem; }
    .btn { background: #6366f1; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .card { background: #1f2937; border: 1px solid #374151; padding: 1.5rem; border-radius: 0.75rem; width: 360px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.875rem; color: #9ca3af; margin-bottom: 0.25rem; }
    .input { width: 100%; box-sizing: border-box; background: #111827; border: 1px solid #4b5563; color: white; padding: 0.5rem; border-radius: 0.375rem; }
    .status { font-size: 0.875rem; color: #10b981; margin-top: 0.5rem; }
    [data-busy="true"] { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>

  <h1>Kitwork 1.0 — Payment Dialog</h1>

  <!-- Component Host with Scope Seeding and Direct Alias $paymentModal -->
  <div
    data-kit-component="payment-dialog"
    data-kit-as="$paymentModal"
    data-kit-scope="
      orderId: 'ORD-9821';
      currency: 'USD';
      amount: 49.99;
      open: false;
      saving: false;
      successMsg: '';
    ">

    <!-- Modal Subtree managed by data-kit-if & data-kit-bind -->
    <div
      data-kit-if="open"
      class="overlay"
      data-kit-click:outside="$component.close()"
      data-kit-keydown:escape:window="$component.close()">

      <div
        class="card"
        data-kit-bind="
          role: 'dialog';
          aria-modal: true;
          aria-label: `Pay order ${orderId}`;
        ">
        <h2 data-kit-text="`Checkout — ${orderId}`">Checkout</h2>

        <div class="field">
          <label>Amount (USD)</label>
          <input class="input" type="number" data-kit-model="amount">
        </div>

        <div class="field">
          <label>Payment Method</label>
          <input class="input" type="text" value="•••• •••• •••• 4242" readonly>
        </div>

        <div class="status" data-kit-text="successMsg" data-kit-show="successMsg"></div>

        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button
            class="btn"
            style="background: #374151;"
            data-kit-click="$component.close()"
            data-kit-bind="disabled: saving;">
            Cancel
          </button>

          <button
            class="btn"
            data-kit-bind="
              disabled: saving || !amount;
              aria-busy: saving;
            "
            data-kit-click="
              successMsg = '';
              saving = true;
              $component.pay();
            ">
            Pay <span data-kit-text="`${amount} ${currency}`">49.99 USD</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Trigger Button calling direct alias $paymentModal from outside -->
  <button class="btn" data-kit-click="$paymentModal.openModal()">
    Open Payment Modal ($paymentModal.openModal())
  </button>

  <script src="../dist/kitwork-runtime.js"></script>
  <script>
    kit.component("payment-dialog", {
      openModal() {
        this.open = true;
        this.successMsg = "";
      },
      close() {
        if (this.saving) return;
        this.open = false;
      },
      pay() {
        var self = this;
        // Simulate async API call with Promise tracking
        return new Promise(function(resolve) {
          setTimeout(function() {
            self.saving = false;
            self.successMsg = "Payment successful for " + self.amount + " " + self.currency + "!";
            setTimeout(function() {
              self.open = false;
            }, 1200);
            resolve();
          }, 1500);
        });
      }
    });
    kit.start();
  </script>
</body>
</html>
