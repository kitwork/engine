<!doctype html>
<html lang="en" data-test-status="pending">
<head>
  <meta charset="utf-8">
  <title>KitJS Drive contract</title>
  <style id="old-jit-style" data-kitwork-jit="css">.old-jit-style { color: red; }</style>
  <script>
    window.__fixtureFetch = null;
    window.__fixtureLifecycle = [];
    window.fetch = function (url, options) { return window.__fixtureFetch(url, options); };
  </script>
  <script data-kitwork-runtime data-kitwork-plan="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script>
    (function () {
      function definition(name) {
        return {
          init: function () {
            var host = this.$host;
            window.__fixtureLifecycle.push({ phase: "init", name: name, id: host.id, connected: host.isConnected });
            return function () {
              window.__fixtureLifecycle.push({ phase: "cleanup", name: name, id: host.id, connected: host.isConnected });
            };
          }
        };
      }
      kit.component("alpha", definition("alpha"));
      kit.component("beta", definition("beta"));
      kit.component("row", definition("row"));
    })();
  </script>
  <script src="../../core/morph.js"></script>
  <script src="../../core/drive.js"></script>
  <script>
    window.__driveContract = {
      core: window.kit.__kitwork_core__,
      morph: window.kit.__kitwork_core__.morph,
      drive: window.kit.__kitwork_core__.drive
    };
  </script>
  <script src="../../core/boot.js"></script>
</head>
<body>
  <main id="app" data-kit-app="main" data-page="initial">
    <input id="draft" value="server-initial">
    <section id="lifecycle" data-kit-component="alpha">Alpha</section>
    <div id="ignored" data-kit-ignore>
      <span id="ignored-value">server ignored value</span>
      <a id="ignored-link" href="/ignored">Ignored navigation</a>
    </div>
    <ul id="rows">
      <li id="row-a" data-kit-key="a" data-kit-component="row">A</li>
      <li id="row-b" data-kit-key="b" data-kit-component="row">B</li>
    </ul>
    <a id="opted-out-link" data-kit-drive="false" href="/opted-out">Native navigation</a>
    <a id="next-link" href="/next">Next</a>
  </main>

  <script>
    (function () {
      "use strict";

      var root = document.documentElement;
      var contract = window.__driveContract;
      var requests = [];
      var aborted = 0;
      var inlineExecutions = 0;
      var runtimeErrors = 0;
      var planA = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa";
      var planB = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb";

      function fail(error) {
        root.setAttribute("data-test-status", "failed");
        root.setAttribute("data-test-error", String(error && error.message || error));
      }

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      function waitFor(predicate, message, deadline) {
        deadline = deadline || Date.now() + 2000;
        return new Promise(function (resolve, reject) {
          function poll() {
            if (predicate()) return resolve();
            if (Date.now() >= deadline) return reject(new Error(message));
            window.setTimeout(poll, 10);
          }
          poll();
        });
      }

      function page(label, title, identity, plan) {
        identity = identity === undefined ? "main" : identity;
        plan = plan === undefined ? planA : plan;
        return "<!doctype html><html><head><title>" + title + "</title>" +
          "<style id=\"unsafe-incoming-style\" onclick=\"inlineExecutions++\" data-kitwork-jit=\"css\">." + label + "-jit { color: blue; }</style>" +
          "<script data-kitwork-runtime data-kitwork-plan=\"" + plan + "\">window.__DRIVE_HEAD_SCRIPT_EXECUTED__ = true;<\/script>" +
          "</head><body><main id=\"app\" data-kit-app=\"" + identity + "\" data-page=\"" + label + "\">" +
          "<input id=\"draft\" value=\"server-" + label + "\">" +
          "<div id=\"ignored\" data-kit-ignore><span id=\"ignored-value\">incoming ignored value</span><a id=\"ignored-link\" href=\"/ignored\">Ignored</a></div>" +
          "<ul id=\"rows\"><li id=\"row-b\" data-kit-key=\"b\" data-kit-component=\"row\">B " + label + "</li><li id=\"row-d\" data-kit-key=\"d\" data-kit-component=\"row\">D</li></ul>" +
          "<form id=\"search-form\" action=\"/form\" method=\"get\"><input name=\"q\" value=\"kit\"><button id=\"search-submit\" name=\"go\" value=\"yes\">Search</button></form>" +
          "<a id=\"opted-out-link\" data-kit-drive=\"false\" href=\"/opted-out\">Native</a>" +
          "<a id=\"next-link\" href=\"/next\">Next</a>" +
          "<script>window.__DRIVE_BODY_SCRIPT_EXECUTED__ = true;<\/script>" +
          "</main></body></html>";
      }

      function response(source) {
        return new Response(source, {
          status: 200,
          headers: { "Content-Type": "text/html; charset=utf-8" }
        });
      }

      window.__fixtureFetch = function (source, options) {
        var url = new URL(source, document.baseURI);
        requests.push({ url: url, options: options });
        if (url.pathname === "/slow") {
          return new Promise(function (resolve, reject) {
            options.signal.addEventListener("abort", function () {
              aborted++;
              reject(new DOMException("Superseded", "AbortError"));
            }, { once: true });
          });
        }
        if (url.pathname === "/next") return Promise.resolve(response(page("next", "Next page")));
        if (url.pathname === "/form") return Promise.resolve(response(page("form", "Form page")));
        if (url.pathname === "/latest") return Promise.resolve(response(page("latest", "Latest page")));
        if (url.pathname === "/pop") return Promise.resolve(response(page("pop", "Pop page")));
        return Promise.resolve(response(page("unexpected", "Unexpected page")));
      };

      window.addEventListener("error", function (event) { fail(event.error || event.message); });
      window.addEventListener("unhandledrejection", function (event) { fail(event.reason); });
      document.addEventListener("kit:error", function () { runtimeErrors++; });

      function dispatchNativeSafeClick(element) {
        function preventNative(event) { event.preventDefault(); }
        window.addEventListener("click", preventNative, { once: true });
        element.dispatchEvent(new MouseEvent("click", {
          bubbles: true,
          cancelable: true,
          button: 0
        }));
      }

      function submit(form, button) {
        var event;
        try {
          event = new SubmitEvent("submit", { bubbles: true, cancelable: true, submitter: button });
        } catch (_) {
          event = document.createEvent("Event");
          event.initEvent("submit", true, true);
          Object.defineProperty(event, "submitter", { value: button });
        }
        form.dispatchEvent(event);
      }

      function run() {
        try {
          assert(window.kit.__kitwork_core__ === undefined, "boot leaked the private core capsule");
          assert(window.kit.morph === undefined && window.kit.drive === undefined, "Drive internals leaked onto the public kit API");
          assert(typeof contract.morph === "function", "internal morph was not installed");
          assert(contract.drive && typeof contract.drive.visit === "function", "internal Drive was not installed");

          var app = document.getElementById("app");
          var documentRoot = document.documentElement;
          var historyLengthBeforeDrive = history.length;
          var draft = document.getElementById("draft");
          var ignored = document.getElementById("ignored");
          var lifecycle = document.getElementById("lifecycle");
          var rowB = document.getElementById("row-b");
          var rowBInstance = contract.core.runtime.componentByHost.get(rowB);
          draft.focus();
          draft.value = "typed draft";
          draft.setSelectionRange(1, 5, "forward");
          document.getElementById("ignored-value").textContent = "live ignored value";

          var incoming = new DOMParser().parseFromString(
            "<main id=\"app\" data-kit-app=\"main\" data-page=\"morphed\">" +
            "<input id=\"draft\" value=\"server-morphed\">" +
            "<section id=\"lifecycle\" data-kit-component=\"beta\">Beta</section>" +
            "<div id=\"ignored\" data-kit-ignore><span id=\"ignored-value\">incoming ignored value</span></div>" +
            "<ul id=\"rows\"><li id=\"row-b\" data-kit-key=\"b\" data-kit-component=\"row\">B updated</li><li id=\"row-c\" data-kit-key=\"c\" data-kit-component=\"row\">C</li></ul>" +
            "<a id=\"opted-out-link\" data-kit-drive=\"false\" href=\"/opted-out\">Native</a>" +
            "<a id=\"next-link\" href=\"/next\">Next</a>" +
            "<script>window.__MORPH_SCRIPT_EXECUTED__ = true;<\/script>" +
            "</main>",
            "text/html"
          ).querySelector("main");

          var result = contract.morph(app, incoming);
          assert(result === app, "stable app root was replaced");
          assert(document.getElementById("draft") === draft, "stable form control lost node identity");
          assert(draft.value === "typed draft", "dirty form value was not preserved");
          assert(draft.selectionStart === 1 && draft.selectionEnd === 5, "text selection was not preserved");
          assert(document.activeElement === draft, "focus was not preserved");
          assert(document.getElementById("ignored") === ignored, "ignored island was replaced");
          assert(document.getElementById("ignored-value").textContent === "live ignored value", "ignored island was traversed");
          assert(document.getElementById("lifecycle") !== lifecycle, "changed component binding did not replace its host");
          assert(document.getElementById("row-b") === rowB, "keyed row lost identity");
          assert(contract.core.runtime.componentByHost.get(rowB) === rowBInstance, "keyed component lost instance identity");
          assert(document.querySelector("#rows > :first-child") === rowB, "keyed row was not reordered");
          assert(!document.getElementById("row-a") && document.getElementById("row-c"), "keyed row removal/addition failed");
          assert(window.__MORPH_SCRIPT_EXECUTED__ === undefined && !app.querySelector("script"), "incoming body script entered the live DOM");
          assert(window.__fixtureLifecycle.some(function (entry) { return entry.phase === "cleanup" && entry.id === "lifecycle" && entry.connected; }), "component host was not disposed before replacement");
          assert(window.__fixtureLifecycle.some(function (entry) { return entry.phase === "cleanup" && entry.id === "row-a" && entry.connected; }), "removed row was not disposed synchronously");
          assert(contract.core.runtime.componentByHost.has(document.getElementById("lifecycle")), "replacement component was not hydrated");
          assert(contract.core.runtime.componentByHost.has(document.getElementById("row-c")), "new keyed component was not hydrated");

          var beforeNative = requests.length;
          dispatchNativeSafeClick(document.getElementById("ignored-link"));
          dispatchNativeSafeClick(document.getElementById("opted-out-link"));
          assert(requests.length === beforeNative, "Drive intercepted an ignored or opted-out link");

          document.getElementById("next-link").dispatchEvent(new MouseEvent("click", {
            bubbles: true,
            cancelable: true,
            button: 0
          }));
        } catch (error) {
          fail(error);
          return;
        }

        waitFor(function () {
          return document.getElementById("app").getAttribute("data-page") === "next";
        }, "Drive link navigation did not commit").then(function () {
          assert(document.documentElement === documentRoot, "Drive replaced the document instead of morphing the app boundary");
          assert(document.title === "Next page", "Drive did not update title");
          assert(window.location.pathname === "/next", "Drive did not push link history");
          assert(history.length === historyLengthBeforeDrive + 1, "Drive did not create exactly one history entry for link navigation");
          assert(requests[requests.length - 1].options.method === "GET", "Drive link request was not GET");
          assert(requests[requests.length - 1].options.headers["X-Kitwork-Drive"] === "1", "Drive request header missing");
          assert(document.getElementById("draft").value === "typed draft", "Drive lost dirty form state");
          assert(document.activeElement === document.getElementById("draft"), "Drive lost focused form control");
          assert(window.__DRIVE_HEAD_SCRIPT_EXECUTED__ === undefined && window.__DRIVE_BODY_SCRIPT_EXECUTED__ === undefined, "Drive executed incoming script");
          assert(!document.getElementById("app").querySelector("script"), "Drive inserted an incoming body script");

          var styles = document.head.querySelectorAll('style[data-kitwork-jit="css"]');
          assert(styles.length === 1 && styles[0].textContent.indexOf(".next-jit") !== -1, "Drive did not reconcile JIT CSS");
          assert(!document.getElementById("old-jit-style") && !document.getElementById("unsafe-incoming-style"), "Drive copied unsafe JIT style attributes");
          assert(!styles[0].hasAttribute("onclick"), "Drive copied an inline handler from JIT style");

          submit(document.getElementById("search-form"), document.getElementById("search-submit"));
          return waitFor(function () {
            return document.getElementById("app").getAttribute("data-page") === "form";
          }, "Drive GET form navigation did not commit");
        }).then(function () {
          var request = requests[requests.length - 1];
          assert(request.url.pathname === "/form", "Drive used the wrong form action");
          assert(request.url.searchParams.get("q") === "kit" && request.url.searchParams.get("go") === "yes", "Drive did not serialize GET form/submitter data");
          assert(document.getElementById("draft").value === "typed draft", "GET navigation lost dirty form state");

          var slow = contract.drive.visit("/slow", { history: "push" });
          var latest = contract.drive.visit("/latest", { history: "push" });
          return Promise.all([slow, latest]);
        }).then(function () {
          assert(aborted === 1, "latest Drive visit did not abort the prior fetch");
          assert(document.getElementById("app").getAttribute("data-page") === "latest", "stale Drive visit won");
          assert(window.location.pathname === "/latest", "latest visit did not update history");
          assert(history.state && history.state.__kitwork_drive__ && history.state.__kitwork_drive__.scroll, "Drive history scroll state missing");

          history.pushState({ marker: "destination", __kitwork_drive__: { scroll: { x: 7, y: 9 } } }, "", "/pop");
          return contract.drive.visit("/pop", { history: "none", scroll: { x: 7, y: 9 } });
        }).then(function () {
          assert(history.state && history.state.marker === "destination", "popstate-style visit overwrote destination history state");
          assert(history.state.__kitwork_drive__.scroll.x === 7 && history.state.__kitwork_drive__.scroll.y === 9, "popstate-style visit overwrote destination scroll state");

          var parser = new DOMParser();
          assert(contract.drive.validate(document, parser.parseFromString(page("valid", "Valid"), "text/html")).valid, "same-plan transition was rejected");
          assert(!contract.drive.validate(document, parser.parseFromString(page("bad-plan", "Bad", "main", planB), "text/html")).valid, "plan mismatch was accepted");
          assert(!contract.drive.validate(document, parser.parseFromString(page("bad-app", "Bad", "other"), "text/html")).valid, "app identity mismatch was accepted");

          var missing = parser.parseFromString("<html><head><script data-kitwork-runtime data-kitwork-plan=\"" + planA + "\"><\/script></head><body><main></main></body></html>", "text/html");
          assert(!contract.drive.validate(document, missing).valid, "missing app marker was accepted");
          var multiple = parser.parseFromString("<html><head><script data-kitwork-runtime data-kitwork-plan=\"" + planA + "\"><\/script></head><body><main data-kit-app=\"main\"></main><aside data-kit-hydrate=\"main\"></aside></body></html>", "text/html");
          assert(!contract.drive.validate(document, multiple).valid, "multiple app markers were accepted");
          var duplicatePlan = parser.parseFromString(page("duplicate", "Duplicate").replace("</head>", "<script data-kitwork-runtime data-kitwork-plan=\"" + planA + "\"><\/script></head>"), "text/html");
          assert(!contract.drive.validate(document, duplicatePlan).valid, "duplicate runtime scripts were accepted");

          var missingRuntime = parser.parseFromString("<html><head></head><body><main data-kit-app=\"main\"></main></body></html>", "text/html");
          assert(!contract.drive.validate(document, missingRuntime).valid, "missing runtime script was accepted");
          var missingPlan = parser.parseFromString("<html><head><script data-kitwork-runtime><\/script></head><body><main data-kit-app=\"main\"></main></body></html>", "text/html");
          assert(!contract.drive.validate(document, missingPlan).valid, "missing plan marker was accepted");
          var emptyPlan = parser.parseFromString("<html><head><script data-kitwork-runtime data-kitwork-plan=\"\"><\/script></head><body><main data-kit-app=\"main\"></main></body></html>", "text/html");
          assert(!contract.drive.validate(document, emptyPlan).valid, "empty plan marker was accepted");
          var invalidPlan = parser.parseFromString(page("invalid-plan", "Invalid", "main", "not-a-sha256"), "text/html");
          assert(!contract.drive.validate(document, invalidPlan).valid, "non-SHA-256 plan marker was accepted");
          var mixedCasePlan = parser.parseFromString(page("mixed-plan", "Mixed", "main", planA.toUpperCase()), "text/html");
          assert(!contract.drive.validate(document, mixedCasePlan).valid, "mixed-case plan marker was accepted");

          var planScript = "<script data-kitwork-runtime data-kitwork-plan=\"" + planA + "\"><\/script>";
          var aliasA = parser.parseFromString("<html><head>" + planScript + "</head><body><main data-kit-hydrate=\"legacy\">A</main></body></html>", "text/html");
          var aliasB = parser.parseFromString("<html><head>" + planScript + "</head><body><main data-kit-hydrate=\"legacy\">B</main></body></html>", "text/html");
          assert(contract.drive.validate(aliasA, aliasB).valid, "data-kit-hydrate compatibility boundary failed");
          var whitespaceA = parser.parseFromString("<html><head>" + planScript + "</head><body><main data-kit-app=\" false \">A</main></body></html>", "text/html");
          var whitespaceB = parser.parseFromString("<html><head>" + planScript + "</head><body><main data-kit-app=\" false \">B</main></body></html>", "text/html");
          assert(contract.drive.validate(whitespaceA, whitespaceB).valid, "opaque whitespace app identity drifted from the Go scanner");
          var disabledA = parser.parseFromString("<html><head>" + planScript + "</head><body><main data-kit-app=\"false\">A</main></body></html>", "text/html");
          assert(!contract.drive.validate(disabledA, disabledA).valid, "exact false app marker was not disabled");
          var htmlA = parser.parseFromString("<html data-kit-app=\"root\"><head>" + planScript + "</head><body>A</body></html>", "text/html");
          var htmlB = parser.parseFromString("<html data-kit-app=\"root\"><head>" + planScript + "</head><body>B</body></html>", "text/html");
          var htmlTransition = contract.drive.validate(htmlA, htmlB);
          assert(htmlTransition.valid && htmlTransition.current.target === htmlA.body, "html app marker did not select body as morph target");

          assert(runtimeErrors === 0, "Drive reported an unexpected runtime error");
          contract.core.destroyRuntime(document.getElementById("draft"));
          assert(contract.drive.stop() === true, "partial subtree destroy stopped document Drive");
          assert(contract.drive.start() === true, "Drive could not restart after explicit stop");
          contract.core.destroyRuntime();
          assert(contract.drive.stop() === false, "full private runtime destroy did not stop Drive");
          assert(inlineExecutions === 0, "an incoming inline handler executed");
          root.setAttribute("data-test-status", "passed");
        }).catch(fail);
      }

      document.addEventListener("DOMContentLoaded", function () {
        window.setTimeout(run, 0);
      }, { once: true });
    })();
  </script>
</body>
</html>
