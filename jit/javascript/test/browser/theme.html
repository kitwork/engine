<!doctype html>
<html
  lang="en"
  data-test-status="pending"
  data-kit-bind="data-theme: $theme.mode; data-scope-conflict: $scopeConflict.eventSafe;"
  data-kit-class="$theme.mode === 'dark' ? 'dark' : ''">
<head>
  <meta charset="utf-8">
  <title>KitJS browser contract: theme</title>
</head>
<body>
  <section id="theme-host" data-kit-component="theme" data-kit-version="1.0.0" data-kit-as="$theme">
    <strong id="resolved" data-kit-text="mode">pending</strong>
    <button id="light" type="button" data-kit-click="mode = 'light'">Light</button>
    <button id="dark" type="button" data-kit-click="mode = 'dark'">Dark</button>
  </section>

  <section
    id="scope-conflict"
    data-kit-component="browser-contract"
    data-kit-as="$scopeConflict"
    data-kit-scope="eventSafe: true"></section>

  <section id="parent" data-kit-component="lifecycle-contract">
    <input data-kit-ref="field" value="parent">
    <section id="child" data-kit-component="lifecycle-contract">
      <input data-kit-ref="field" value="child">
    </section>
  </section>

  <section data-kit-component="browser-contract">
    <button
      id="event-surface"
      type="button"
      data-kit-click="inspectEvent($event.view, $event.composedPath)">
      Inspect event surface
    </button>
    <button
      id="instance-surface"
      type="button"
      data-kit-click="inspectInstance($theme.$host, $theme.$refs)">
      Inspect instance surface
    </button>
    <button
      id="computed-surface"
      type="button"
      data-kit-click="inspectComputed($theme[['mode']])">
      Inspect computed member surface
    </button>
    <button
      id="promise-program"
      type="button"
      data-kit-click="waitForPromise(); markSync()">
      Inspect action Promise program
    </button>
    <output id="event-safe" data-kit-text="eventSafe ? 'safe' : 'unsafe'">pending</output>
    <output id="instance-safe" data-kit-text="instanceSafe ? 'safe' : 'unsafe'">pending</output>
    <output id="computed-safe" data-kit-text="computedSafe ? 'safe' : 'unsafe'">pending</output>
    <output id="promise-settled" data-kit-text="promiseSettled ? 'settled' : 'pending'">pending</output>
    <output id="sync-ran" data-kit-text="syncRan ? 'ran' : 'pending'">pending</output>
    <output
      id="async-binding"
      class="static-token"
      data-async="ssr"
      data-kit-text="bindingPromise()"
      data-kit-show="bindingPromise()"
      data-kit-bind="data-async: bindingPromise();"
      data-kit-class="bindingPromise()">SSR</output>
    <output
      id="async-class-map"
      class="map-static"
      data-kit-class="'async-token': bindingPromise();">Map SSR</output>
  </section>

  <script src="../../core/global.js"></script>
  <script src="../../core/expression.js"></script>
  <script src="../../core/component.js"></script>
  <script src="../../core/dom.js"></script>
  <script src="../../core/lifecycle.js"></script>
  <script src="../../service/storage/1.0.0.js"></script>
  <script src="../../component/theme/1.0.0.js"></script>
  <script>
    (function () {
      function appendLifecycle(value) {
        var root = document.documentElement;
        var current = root.getAttribute("data-lifecycle");
        root.setAttribute("data-lifecycle", current ? current + "," + value : value);
      }

      kit.component("lifecycle-contract", {
        init: function () {
          var component = this;
          var id = this.$host.id;
          appendLifecycle(id + "-init");
          return function () {
            appendLifecycle(id + "-cleanup");
            return Promise.resolve().then(function () {
              var released = component.$host === null && Object.keys(component.$refs).length === 0;
              appendLifecycle(id + (released ? "-released" : "-retained"));
              throw new Error("expected-cleanup-rejection");
            });
          };
        }
      });

      kit.component("browser-contract", {
        eventSafe: false,
        instanceSafe: false,
        computedSafe: false,
        promiseSettled: false,
        syncRan: false,

        inspectEvent: function (view, composedPath) {
          this.eventSafe = view === undefined && composedPath === undefined;
        },

        inspectInstance: function (host, refs) {
          this.instanceSafe = host === undefined && refs === undefined;
        },

        inspectComputed: function (value) {
          this.computedSafe = value === undefined;
        },

        waitForPromise: function () {
          var component = this;
          return new Promise(function (resolve) {
            setTimeout(function () {
              component.promiseSettled = true;
              resolve(true);
            }, 10);
          });
        },

        markSync: function () {
          this.syncRan = true;
          return true;
        },

        bindingPromise: function () {
          return Promise.resolve("client-value-must-not-render");
        }
      });
    })();
  </script>
  <script src="../../core/boot.js"></script>
  <script>
    (function () {
      "use strict";

      var root = document.documentElement;
      var cleanupErrors = 0;

      function fail(message) {
        root.setAttribute("data-test-status", "failed");
        root.setAttribute("data-test-error", String(message));
      }

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      window.addEventListener("error", function (event) {
        fail(event.message || "browser error");
      });
      window.addEventListener("unhandledrejection", function (event) {
        fail(event.reason || "unhandled rejection");
      });
      document.addEventListener("kit:error", function (event) {
        var detail = event.detail || {};
        var context = detail.context || {};
        if (context.lifecycle === "cleanup" && detail.error && detail.error.message === "expected-cleanup-rejection") {
          cleanupErrors++;
        }
      });

      document.addEventListener("DOMContentLoaded", function () {
        window.setTimeout(function () {
          try {
            assert(window.kit && typeof window.kit.component === "function", "kit API missing");
            assert(window.KitworkRuntime === undefined, "unexpected second global");
            assert(window.kit.theme === undefined, "theme must remain a component, not a service");
            assert(!root.hasAttribute("data-scope-conflict"), "component+scope conflict mounted in direct-script mode");

            document.getElementById("event-surface").click();
            document.getElementById("instance-surface").click();
            document.getElementById("computed-surface").click();
            document.getElementById("promise-program").click();
            document.getElementById("dark").click();
            assert(document.getElementById("promise-program").getAttribute("data-busy") === "true", "non-final action Promise was not observed");

            window.setTimeout(function () {
              try {
                assert(root.getAttribute("data-theme") === "dark", "external alias binding did not update");
                assert(root.classList.contains("dark"), "Tailwind dark selector class missing");
                assert(document.getElementById("resolved").textContent === "dark", "local binding did not update");
                assert(document.getElementById("event-safe").textContent === "safe", "native Event escaped authored expressions");
                assert(document.getElementById("instance-safe").textContent === "safe", "raw component handles escaped authored expressions");
                assert(document.getElementById("computed-safe").textContent === "safe", "object-valued computed member key was coerced");
                assert(!document.getElementById("promise-program").hasAttribute("data-busy"), "action Promise busy state did not settle");
                assert(document.getElementById("promise-settled").textContent === "settled", "non-final action Promise did not settle reactively");
                assert(document.getElementById("sync-ran").textContent === "ran", "action program did not continue after a Promise result");
                assert(document.getElementById("async-binding").textContent === "SSR", "async binding replaced server content");
                assert(document.getElementById("async-binding").getAttribute("data-async") === "ssr", "async bind wrote a Promise");
                assert(!document.getElementById("async-binding").hidden, "async show coerced a Promise");
                assert(document.getElementById("async-binding").classList.contains("static-token"), "async class changed static classes");
                assert(document.getElementById("async-class-map").classList.contains("map-static"), "async class map removed a static class");
                assert(!document.getElementById("async-class-map").classList.contains("async-token"), "async class map coerced a Promise");

                document.getElementById("parent").remove();
                var host = document.getElementById("theme-host");
                host.remove();
                window.setTimeout(function () {
                  try {
                    assert(
                      root.getAttribute("data-lifecycle") === "parent-init,child-init,child-cleanup,parent-cleanup,child-released,parent-released",
                      "component lifecycle order or ownership release is incorrect"
                    );
                    assert(cleanupErrors === 2, "async cleanup rejection was not observed");
                    document.body.insertBefore(host, document.body.firstChild);
                    window.setTimeout(function () {
                      try {
                        document.getElementById("light").click();
                        window.setTimeout(function () {
                          try {
                            assert(root.getAttribute("data-theme") === "light", "reinserted subtree was not recompiled");
                            assert(!root.classList.contains("dark"), "dynamic class was not diffed after remount");
                            root.setAttribute("data-test-status", "passed");
                          } catch (error) { fail(error.message); }
                        }, 0);
                      } catch (error) { fail(error.message); }
                    }, 0);
                  } catch (error) { fail(error.message); }
                }, 0);
              } catch (error) { fail(error.message); }
            }, 20);
          } catch (error) { fail(error.message); }
        }, 0);
      }, { once: true });
    })();
  </script>
</body>
</html>
