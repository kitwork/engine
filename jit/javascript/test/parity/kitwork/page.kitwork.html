<!-- COUNTER_PROOF_START -->
<main data-kit-component="counter" data-kit-version="1.0.0">
  <button id="decrement" type="button" data-kit-click="count = count - 1">-</button>
  <output id="count" data-kit-text="count">server fallback</output>
  <button id="increment" type="button" data-kit-click="count = count + 1">+</button>
</main>
<!-- COUNTER_PROOF_END -->
